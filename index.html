<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>沖繩自駕之旅 - 互動地圖</title>
    <!-- 引入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* 鎖定全螢幕，採用 App 式佈局 */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f8fafc; }
        #root { height: 100%; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 自訂捲軸 */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 地圖樣式覆寫 */
        .leaflet-div-icon { background: transparent; border: none; }
        .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); overflow: hidden; }
        .leaflet-popup-content { margin: 0; }
        
        /* 地圖標記懸停動畫 */
        .marker-anim { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .marker-anim:hover { transform: scale(1.2); z-index: 1000 !important; }

        /* 導航路線動畫 */
        .route-line { stroke-dasharray: 15, 15; animation: dash 30s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -1000; } }

        /* 防止行動端點擊閃爍與縮放 */
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        input, select, textarea { font-size: 16px !important; }
        .route-checkbox:checked + div { border-color: transparent; }
        
        /* 動畫 */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .icon-spin { animation: spin 1s linear infinite; }
        .drag-over { border: 2px dashed #3b82f6 !important; opacity: 0.7; transform: scale(0.98); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ==========================================
        // 1. ⚠️【重要設定】請在此填入您的 Firebase 金鑰
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDEwxQqGnGcyr-480VFTbsE1FZDcf3neFo",
            authDomain: "okinawahot-174b8.firebaseapp.com",
            projectId: "okinawahot-174b8",
            storageBucket: "okinawahot-174b8.firebasestorage.app",
            messagingSenderId: "502127203745",
            appId: "1:502127203745:web:7935f2cf50659025aca7e0"
        };

        const TRIP_ID = 'okinawa-trip-2026'; // 您專屬的資料庫識別碼
        const MEMBERS = ["志展", "盧志", "大維", "禹康", "懿軒"];
        
        // ==========================================
        // 基本設定與常數
        // ==========================================
        const SUB_TYPES = {
            attraction: { label: '景點', color: '#3b82f6', icon: 'camera', badgeBg: 'bg-blue-100', badgeText: 'text-blue-700', border: 'border-blue-500' },
            food: { label: '食物', color: '#ef4444', icon: 'utensils', badgeBg: 'bg-red-100', badgeText: 'text-red-700', border: 'border-red-500' },
            shopping: { label: '購物', color: '#a855f7', icon: 'shopping-bag', badgeBg: 'bg-purple-100', badgeText: 'text-purple-700', border: 'border-purple-500' },
            accommodation: { label: '住宿', color: '#f97316', icon: 'bed', badgeBg: 'bg-orange-100', badgeText: 'text-orange-700', border: 'border-orange-500' }
        };
        const DAY_COLORS = { 1: '#3b82f6', 2: '#10b981', 3: '#ef4444', 4: '#f59e0b', 5: '#8b5cf6', 6: '#ec4899' };

        const INITIAL_ITINERARY = [
            { id: 'seed_1', day: 1, time: '19:45', content: '全員抵達那霸機場、飯店 Check-in', location: '那霸機場', url: 'https://www.google.com/maps/search/?api=1&query=那霸機場', lat: 26.2064, lng: 127.6465, member: '志展', type: 'main', subType: 'accommodation' },
            { id: 'seed_2', day: 1, time: '21:30', content: '晚餐：Torijin Naha (鳥神串燒)', location: 'Torijin Naha', url: 'https://www.google.com/maps/search/?api=1&query=那覇+焼き鳥+鳥神', lat: 26.2155, lng: 127.6792, member: '盧志', type: 'main', subType: 'food' },
            { id: 'seed_3', day: 2, time: '09:00', content: '市區取車 → 波上宮', location: '波上宮', url: 'https://www.google.com/maps/search/?api=1&query=波上宮', lat: 26.2207, lng: 127.6711, member: '大維', type: 'main', subType: 'attraction' },
            { id: 'seed_4', day: 2, time: '11:30', content: '午餐：漁師食堂 (海鮮)', location: '漁師食堂', url: 'https://www.google.com/maps/search/?api=1&query=漁師食堂+大木海產物', lat: 26.3456, lng: 127.7890, member: '禹康', type: 'main', subType: 'food' },
            { id: 'seed_5', day: 2, time: '14:00', content: '購物：PARCO CITY', location: 'PARCO CITY', url: 'https://www.google.com/maps/search/?api=1&query=浦添西海岸+PARCO+CITY', lat: 26.2625, lng: 127.6975, member: '懿軒', type: 'main', subType: 'shopping' },
            { id: 'seed_6', day: 3, time: '10:00', content: '重點：美麗海水族館', location: '美麗海水族館', url: 'https://www.google.com/maps/search/?api=1&query=沖縄美ら海水族館', lat: 26.6944, lng: 127.8779, member: '大維', type: 'main', subType: 'attraction' },
            { id: 'seed_7', day: 4, time: '12:00', content: '散策：美國村深度漫遊', location: '美國村', url: 'https://www.google.com/maps/search/?api=1&query=北谷美浜アメリカンビレッジ', lat: 26.3163, lng: 127.7576, member: '盧志', type: 'main', subType: 'attraction' },
            { id: 'seed_8', day: 5, time: '10:30', content: '景點：沖繩世界 (玉泉洞)', location: '沖繩世界', url: 'https://www.google.com/maps/search/?api=1&query=おきなわワールド', lat: 26.1397, lng: 127.7503, member: '志展', type: 'main', subType: 'attraction' },
            { id: 'seed_9', day: 6, time: '09:30', content: '景點：首里城參觀', location: '首里城', url: 'https://www.google.com/maps/search/?api=1&query=首里城', lat: 26.2170, lng: 127.7194, member: '懿軒', type: 'main', subType: 'attraction' }
        ];

        // ==========================================
        // 2. 共用小元件 (Shared UI Components)
        // ==========================================
        const Icon = ({ name, className = "w-4 h-4" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} style={{ display: 'contents' }}></span>;
        };

        const Toast = ({ message, visible }) => {
            if (!visible) return null;
            return (
                <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[4000] toast-enter">
                    <div className="bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 font-bold text-sm whitespace-nowrap">
                        <Icon name="check-circle-2" className="w-5 h-5 text-green-400" /> {message}
                    </div>
                </div>
            );
        };

        const callGeminiWithBackoff = async (prompt, maxRetries = 5) => {
            const apiKey = ""; // GitHub Pages 環境如需 AI 功能，請在此填入 Gemini API Key
            if (!apiKey) return "提示：在此環境中未配置 AI API 金鑰。請手動填寫行程內容。";
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error(`HTTP error!`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "無法產生內容。";
                } catch (error) {
                    if (i === maxRetries - 1) return "API 呼叫失敗，請稍後再試。";
                    await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000));
                }
            }
        };

        // ==========================================
        // 3. 自訂 Hooks (Firestore 同步邏輯)
        // ==========================================
        const useFirebase = () => {
            const [itinerary, setItinerary] = useState([]);
            const [isLocalMode, setIsLocalMode] = useState(true);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                let unsubscribe;
                const init = async () => {
                    // 防呆機制：如果還沒填寫 API 金鑰，直接切換為離線模式
                    if (!firebaseConfig.apiKey || AIzaSyDEwxQqGnGcyr-480VFTbsE1FZDcf3neFo("請替換成您的")) {
                        console.warn("⚠️ 尚未設定 Firebase Config，目前使用本地離線模式 (重整後資料會消失)");
                        setIsLocalMode(true);
                        setItinerary(INITIAL_ITINERARY);
                        setLoading(false);
                        return;
                    }

                    try {
                        const app = firebase.apps.length > 0 ? firebase.app() : firebase.initializeApp(firebaseConfig);
                        const auth = firebase.auth();
                        
                        // 等待匿名登入完成
                        await auth.signInAnonymously();

                        const db = firebase.firestore();
                        const col = db.collection('trips').doc(TRIP_ID).collection('itinerary');
                        
                        unsubscribe = col.onSnapshot(snapshot => {
                            const data = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                            if (data.length > 0) {
                                setItinerary(data.sort((a, b) => a.day !== b.day ? a.day - b.day : a.time.localeCompare(b.time)));
                            } else {
                                INITIAL_ITINERARY.forEach(item => {
                                    const { id, ...itemData } = item;
                                    col.doc(id).set(itemData);
                                });
                            }
                            setIsLocalMode(false);
                            setLoading(false);
                        }, err => { 
                            console.error("Firestore 同步權限錯誤 (請檢查 Firestore Rules):", err); 
                            setIsLocalMode(true); 
                            setItinerary(INITIAL_ITINERARY);
                            setLoading(false); 
                        });
                        
                    } catch (e) {
                        console.warn("無法啟動 Firebase，降級為本地模式", e);
                        setIsLocalMode(true);
                        setItinerary(INITIAL_ITINERARY);
                        setLoading(false);
                    }
                };
                init();
                return () => unsubscribe && unsubscribe();
            }, []);

            const saveItem = async (data, isEdit) => {
                if (isLocalMode) {
                    if (isEdit) setItinerary(p => p.map(i => i.id === data.id ? data : i).sort((a,b)=> a.day!==b.day ? a.day-b.day : a.time.localeCompare(b.time)));
                    else setItinerary(p => [...p, { ...data, id: Date.now().toString() }].sort((a,b)=> a.day!==b.day ? a.day-b.day : a.time.localeCompare(b.time)));
                    return;
                }
                const col = firebase.firestore().collection('trips').doc(TRIP_ID).collection('itinerary');
                if (isEdit) {
                    const { id, ...updateData } = data;
                    await col.doc(id).update(updateData);
                } else {
                    await col.add(data);
                }
            };

            const deleteItem = async (id) => {
                if (isLocalMode) { setItinerary(p => p.filter(i => i.id !== id)); return; }
                await firebase.firestore().collection('trips').doc(TRIP_ID).collection('itinerary').doc(id).delete();
            };

            const batchUpdate = async (updates) => {
                if (isLocalMode) {
                    setItinerary(p => p.map(item => {
                        const match = updates.find(u => u.id === item.id);
                        return match ? { ...item, ...match } : item;
                    }).sort((a,b)=> a.day!==b.day ? a.day-b.day : a.time.localeCompare(b.time)));
                    return;
                }
                const db = firebase.firestore();
                const col = db.collection('trips').doc(TRIP_ID).collection('itinerary');
                const batch = db.batch();
                updates.forEach(u => {
                    const { id, ...fields } = u;
                    batch.update(col.doc(id), fields);
                });
                await batch.commit();
            }

            return { itinerary, loading, isLocalMode, saveItem, deleteItem, batchUpdate };
        };

        // ==========================================
        // 4. 模組化 UI 組件 (Modular Components)
        // ==========================================

        const Header = ({ isLocalMode, viewMode, setViewMode, onOpenModal }) => (
            <header className="bg-slate-900 text-white px-3 py-2 md:px-4 md:py-3 shadow-xl flex-shrink-0 flex flex-wrap justify-between items-center z-20 gap-y-2 md:gap-y-3">
                <div className="flex items-center gap-2 md:gap-3 w-auto">
                    <div className="bg-blue-600 p-1.5 md:p-2 rounded-lg shadow-inner hidden md:block"><Icon name="map" className="w-4 h-4 md:w-5 md:h-5" /></div>
                    <div>
                        <h1 className="text-base md:text-lg font-black tracking-tight leading-none">沖繩旅遊地圖</h1>
                        <p className="text-[9px] md:text-[10px] font-bold uppercase tracking-widest mt-1 flex gap-1 md:gap-2">
                            <span className={isLocalMode ? 'text-amber-400' : 'text-emerald-400'}>
                                {isLocalMode ? '● Offline Mode (未連線資料庫)' : '● Real-time Sync (雲端同步中)'}
                            </span>
                        </p>
                    </div>
                </div>
                <div className="w-full md:w-auto flex bg-slate-800 p-1 rounded-xl shadow-inner order-3 md:order-2 justify-center">
                    <button onClick={() => setViewMode('itinerary')} className={`flex-1 md:flex-none px-4 md:px-6 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-bold transition-all flex items-center justify-center gap-1.5 md:gap-2 ${viewMode === 'itinerary' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                        <Icon name="list" className="w-3.5 h-3.5 md:w-4 md:h-4" /> 單日行程
                    </button>
                    <button onClick={() => setViewMode('route')} className={`flex-1 md:flex-none px-4 md:px-6 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-bold transition-all flex items-center justify-center gap-1.5 md:gap-2 ${viewMode === 'route' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                        <Icon name="route" className="w-3.5 h-3.5 md:w-4 md:h-4" /> 路線地圖
                    </button>
                </div>
                <div className="w-auto flex justify-end order-2 md:order-3">
                    <button onClick={onOpenModal} className="bg-gradient-to-br from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 px-3 py-1.5 md:px-4 md:py-2 rounded-full font-bold text-xs md:text-sm flex items-center gap-1 shadow-lg active:scale-95 transition-all border border-blue-400/50">
                        <Icon name="plus" className="w-3.5 h-3.5 md:w-4 md:h-4" /> 新增
                    </button>
                </div>
            </header>
        );

        const MapArea = ({ itinerary, viewMode, activeDay, routeDays, selectedLocation, isMobile, mapHeightVH, setRouteMetrics }) => {
            const mapRef = useRef(null);
            const leafletMap = useRef(null);
            const markersRef = useRef({});
            const polylinesRef = useRef([]);

            // 初始化地圖
            useEffect(() => {
                if (!leafletMap.current && mapRef.current) {
                    leafletMap.current = L.map(mapRef.current, { zoomControl: true, scrollWheelZoom: true }).setView([26.4, 127.8], 9);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(leafletMap.current);
                }
            }, []);

            // 繪製標記與路線
            useEffect(() => {
                if (!leafletMap.current) return;
                let isActive = true;
                leafletMap.current.invalidateSize();
                
                Object.values(markersRef.current).forEach(m => m.remove());
                markersRef.current = {};
                polylinesRef.current.forEach(p => p.remove());
                polylinesRef.current = [];

                const daysToRender = viewMode === 'route' ? routeDays : [activeDay];
                const allLatLngs = [];

                const renderDay = async () => {
                    const promises = daysToRender.map(async (day) => {
                        const dayItems = itinerary.filter(i => i.day === day).sort((a,b) => a.time.localeCompare(b.time));
                        const validItems = dayItems.filter(i => i.lat && i.lng);
                        if(validItems.length === 0) return { day, metrics: null };

                        const latlngs = validItems.map(i => [i.lat, i.lng]);
                        allLatLngs.push(...latlngs);

                        validItems.forEach((item, index) => {
                            const sub = SUB_TYPES[item.subType] || SUB_TYPES.attraction;
                            const borderColor = item.type === 'backup' ? '#f59e0b' : '#ffffff';
                            let html = viewMode === 'route' 
                                ? `<div class="marker-anim flex items-center justify-center text-white font-bold" style="background-color: ${DAY_COLORS[day]}; width: 20px; height: 20px; border: 2px solid ${borderColor}; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4); font-size: 10px;">${index + 1}</div>`
                                : `<div class="marker-anim" style="background-color: ${sub.color}; width: 12px; height: 12px; border: 2px solid ${borderColor}; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4);"></div>`;
                            
                            const iconSize = viewMode === 'route' ? [20, 20] : [12, 12];
                            const icon = L.divIcon({ html, className: '', iconSize, iconAnchor: [iconSize[0]/2, iconSize[1]/2] });

                            const marker = L.marker([item.lat, item.lng], { icon }).addTo(leafletMap.current).bindPopup(`
                                <div class="p-2 min-w-[140px] md:min-w-[180px]">
                                    <div class="flex items-center gap-1 mb-1.5"><span class="text-[9px] px-1.5 py-0.5 rounded ${sub.badgeBg} ${sub.badgeText} font-bold">${sub.label}</span></div>
                                    <h3 class="font-bold text-xs md:text-sm text-slate-800 mb-1 leading-tight truncate">${item.location || item.content}</h3>
                                    ${item.location ? `<p class="text-[10px] md:text-xs text-gray-500 mb-2 leading-tight line-clamp-2">${item.content}</p>` : ''}
                                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" style="color: #ffffff !important;" class="text-[10px] md:text-xs bg-blue-600 px-2 py-1.5 md:py-2.5 rounded-md block text-center font-black shadow-md hover:bg-blue-700 active:scale-95 transition-all tracking-widest text-white mt-1">導航</a>
                                </div>
                            `, { closeButton: false, autoPanPadding: [20, 20] });
                            markersRef.current[item.id] = marker;
                        });

                        if (latlngs.length < 2) return { day, metrics: null };

                        try {
                            const coordsStr = latlngs.map(ll => `${ll[1]},${ll[0]}`).join(';');
                            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`);
                            const data = await res.json();
                            if (data.code === 'Ok') {
                                return { day, metrics: data.routes[0].legs, coords: data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]) };
                            }
                        } catch(e) { console.warn(e); }
                        return { day, metrics: null, coords: latlngs, fallback: true };
                    });

                    const results = await Promise.all(promises);
                    if (!isActive) return;

                    const newMetrics = {};
                    results.forEach(({ day, metrics, coords, fallback }) => {
                        if(coords) {
                            const line = L.polyline(coords, { 
                                color: viewMode === 'route' ? DAY_COLORS[day] : '#64748b', 
                                weight: fallback ? 3 : 4, opacity: 0.7, 
                                dashArray: fallback ? '8,8' : '', className: 'route-line' 
                            }).addTo(leafletMap.current);
                            polylinesRef.current.push(line);
                        }
                        if(metrics) newMetrics[day] = metrics;
                    });
                    setRouteMetrics(newMetrics);

                    if (allLatLngs.length > 0) {
                        const b = L.latLngBounds(allLatLngs);
                        leafletMap.current.fitBounds(b, { padding: [50, 50], maxZoom: 15 });
                    }
                };
                setTimeout(renderDay, 100);
                return () => isActive = false;
            }, [itinerary, viewMode, activeDay, routeDays]);

            // 監聽拖曳改變高度
            useEffect(() => { if (leafletMap.current) leafletMap.current.invalidateSize(); }, [mapHeightVH, isMobile]);

            // 點擊列表時聚焦地圖
            useEffect(() => {
                if (selectedLocation && leafletMap.current) {
                    leafletMap.current.setView([selectedLocation.lat, selectedLocation.lng], 16, { animate: true });
                    setTimeout(() => {
                        if (markersRef.current[selectedLocation.id]) markersRef.current[selectedLocation.id].openPopup();
                    }, 300);
                }
            }, [selectedLocation]);

            return (
                <div className="relative w-full md:w-[70%] md:flex-none z-0 order-1 md:order-2 flex-shrink-0 md:border-b-0 border-slate-200" style={{ height: isMobile ? `${mapHeightVH}vh` : '100%' }}>
                    <div id="map-container" ref={mapRef} className="absolute inset-0 w-full h-full z-0 bg-slate-100"></div>
                    <div className="absolute bottom-3 left-3 md:bottom-4 md:left-4 z-[1000] pointer-events-none md:pointer-events-auto">
                        <div className="bg-white/95 backdrop-blur-md p-2 md:p-2.5 rounded-xl shadow-lg border border-slate-100 text-[10px] md:text-xs space-y-1 md:space-y-1.5">
                            <div className="flex items-center gap-1 md:gap-2 font-black text-slate-800 border-b border-slate-100 pb-1"><Icon name="info" className="w-3 h-3 md:w-4 md:h-4 text-blue-500" /> 圖例</div>
                            {viewMode === 'itinerary' ? (
                                <div className="flex flex-col gap-y-1">
                                    {Object.values(SUB_TYPES).map(s => (
                                        <div key={s.label} className="flex items-center gap-1.5 md:gap-2 font-bold text-slate-600">
                                            <div className="w-2 h-2 md:w-3 md:h-3 rounded-full shadow-sm border border-white" style={{backgroundColor: s.color}}></div> {s.label}
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="flex flex-col gap-1">
                                    <div className="flex items-center gap-1.5 md:gap-2 font-bold text-slate-600"><div className="w-3 h-3 md:w-4 md:h-4 rounded-full shadow-sm flex items-center justify-center text-[7px] md:text-[8px] text-white bg-slate-800">1</div> 順序</div>
                                    <div className="flex items-center gap-1.5 md:gap-2 font-bold text-slate-600"><div className="w-3 h-1 md:w-4 md:h-1.5 rounded-full bg-slate-400"></div> 行車路線</div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Sidebar = ({ itinerary, viewMode, activeDay, setActiveDay, routeDays, toggleRouteDay, onEdit, onDelete, onShiftTime, onDragDrop, onFocus, routeMetrics, showToast }) => {
            const [draggedId, setDraggedId] = useState(null);
            const [isGettingAdvice, setIsGettingAdvice] = useState(false);
            const [aiAdviceMap, setAiAdviceMap] = useState({});

            const handleGetDailyAdvice = async () => {
                const dayItems = itinerary.filter(i => i.day === activeDay).sort((a,b) => a.time.localeCompare(b.time));
                if (dayItems.length === 0) return;
                setIsGettingAdvice(true);
                const itineraryText = dayItems.map(i => `${i.time} - ${i.location || i.content}`).join('\n');
                const prompt = `你是一個專業的沖繩旅遊顧問。這是我規劃的第 ${activeDay} 天行程：\n${itineraryText}\n\n請用繁體中文給出一段約 50 字以內的簡短建議。指出行程順暢度、或該地點隱藏亮點。`;
                const advice = await callGeminiWithBackoff(prompt);
                setAiAdviceMap(prev => ({ ...prev, [activeDay]: advice }));
                setIsGettingAdvice(false);
            };

            const handleExportText = () => {
                const items = itinerary.filter(i => i.day === activeDay).sort((a,b)=>a.time.localeCompare(b.time));
                let txt = `🚗 沖繩自駕 Day ${activeDay} 行程\n`;
                items.forEach(i => { txt += `[${i.time}] ${i.location || i.content}\n${i.location && i.content !== i.location ? `  📝 ${i.content}\n` : ''}`; });
                const el = document.createElement('textarea'); el.value = txt; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                showToast("✅ 已將純文字行程複製到剪貼簿！");
            };

            const handleExportNav = () => {
                const items = itinerary.filter(i => i.day === activeDay && i.lat).sort((a,b)=>a.time.localeCompare(b.time));
                if(items.length < 2) return showToast("⚠️ 當天需至少有兩個含座標的地點才能產生導航！");
                const origin = `${items[0].lat},${items[0].lng}`;
                const dest = `${items[items.length-1].lat},${items[items.length-1].lng}`;
                const wps = items.slice(1,-1).map(i => `${i.lat},${i.lng}`).join('|');
                window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving${wps ? `&waypoints=${wps}` : ''}`, '_blank');
            };

            return (
                <div className="flex-1 md:flex-none w-full md:w-[30%] flex flex-col bg-slate-50 overflow-hidden shadow-2xl z-10 order-3 md:order-1 flex-shrink-0">
                    {viewMode === 'itinerary' ? (
                        <React.Fragment>
                            <div className="flex overflow-x-auto p-2 md:p-3 bg-white gap-1.5 md:gap-2 border-b flex-shrink-0 scrollbar-hide shadow-sm z-10">
                                {[1,2,3,4,5,6].map(d => (
                                    <button key={d} onClick={() => setActiveDay(d)} className={`flex-shrink-0 w-12 h-10 md:w-14 md:h-12 rounded-xl font-black text-sm md:text-lg transition-all active:scale-90 flex items-center justify-center ${activeDay === d ? 'bg-slate-900 text-white shadow-md transform scale-105' : 'bg-slate-100 text-slate-400 border border-slate-200 hover:bg-slate-200'}`}>D{d}</button>
                                ))}
                            </div>
                            
                            <div className="px-3 md:px-4 pt-3 md:pt-4 flex gap-2">
                                <button onClick={handleExportText} className="flex-1 bg-white border border-slate-200 text-slate-600 text-[10px] md:text-xs font-bold py-2 rounded-lg shadow-sm hover:bg-slate-50 active:scale-95 flex items-center justify-center gap-1.5"><Icon name="copy" className="w-3.5 h-3.5" />複製行程</button>
                                <button onClick={handleExportNav} className="flex-1 bg-white border border-slate-200 text-slate-600 text-[10px] md:text-xs font-bold py-2 rounded-lg shadow-sm hover:bg-slate-50 active:scale-95 flex items-center justify-center gap-1.5"><Icon name="navigation" className="w-3.5 h-3.5 text-blue-500" />多點導航</button>
                            </div>

                            {itinerary.filter(i => i.day === activeDay).length > 0 && (
                                <div className="px-3 pt-3 md:px-4 md:pt-4 pb-0 z-10 bg-slate-50">
                                    <button onClick={handleGetDailyAdvice} disabled={isGettingAdvice} className="w-full bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-100 text-indigo-700 text-[11px] md:text-xs font-bold py-2 rounded-xl shadow-sm hover:shadow active:scale-95 transition-all flex items-center justify-center gap-1.5">
                                        {isGettingAdvice ? <Icon name="loader-2" className="w-3.5 h-3.5 md:w-4 md:h-4 icon-spin" /> : "✨ AI 幫我看看今天行程"}
                                    </button>
                                    {aiAdviceMap[activeDay] && (
                                        <div className="mt-2.5 p-3 bg-indigo-50 border border-indigo-100 rounded-xl text-[11px] md:text-xs text-slate-700 leading-relaxed shadow-inner relative animate-in fade-in slide-in-from-top-2">
                                            <strong className="text-indigo-800 block mb-1"><span className="text-xs md:text-[14px]">💡</span> 行程建議：</strong>
                                            {aiAdviceMap[activeDay]}
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="flex-1 overflow-y-auto p-3 md:p-4 space-y-3 md:space-y-4 custom-scrollbar bg-slate-50 pb-10">
                                <p className="text-[9px] md:text-[10px] text-center text-slate-400 font-bold mb-1.5 md:mb-2">💡 提示：按住卡片可上下拖曳排序</p>
                                {itinerary.filter(i => i.day === activeDay).map((item) => {
                                    const sub = SUB_TYPES[item.subType] || SUB_TYPES.attraction;
                                    const isDragging = draggedId === item.id;
                                    return (
                                        <div key={item.id} draggable onDragStart={(e)=>{ e.dataTransfer.setData('text', item.id); setDraggedId(item.id);}} onDragOver={e=>{e.preventDefault(); e.currentTarget.classList.add('drag-over');}} onDragLeave={e=>e.currentTarget.classList.remove('drag-over')} onDrop={e=>{e.preventDefault(); e.currentTarget.classList.remove('drag-over'); onDragDrop(e.dataTransfer.getData('text'), item.id); setDraggedId(null);}} onClick={() => onFocus(item)} className={`group cursor-pointer bg-white border-2 rounded-2xl p-3 md:p-4 shadow-sm border-l-[4px] md:border-l-[6px] transition-all duration-200 active:scale-[0.98] md:hover:-translate-y-1 md:hover:shadow-md overflow-hidden ${sub.border.replace('border-','border-l-')} border-t-transparent border-r-transparent border-b-transparent ${isDragging?'opacity-40':''}`}>
                                            <div className="flex justify-between items-start mb-1.5 md:mb-2">
                                                <div className="flex items-center gap-1.5 md:gap-2 flex-wrap">
                                                    <span className="text-[11px] md:text-sm font-black text-slate-600 flex items-center gap-1 bg-slate-100 px-2 py-0.5 md:px-2.5 md:py-1 rounded-md"><Icon name="clock" className="w-3 h-3 md:w-3.5 md:h-3.5" /> {item.time}</span>
                                                    <span className={`text-[9px] md:text-xs px-2 py-0.5 md:px-2.5 md:py-1 rounded-md font-black flex items-center gap-1 ${sub.badgeBg} ${sub.badgeText}`}><Icon name={sub.icon} className="w-2.5 h-2.5 md:w-3 md:h-3" /> {sub.label}</span>
                                                    {item.type === 'backup' && <span className="text-[9px] md:text-xs px-2 py-0.5 md:px-2.5 md:py-1 rounded-md font-black bg-amber-100 text-amber-700 border border-amber-200">備選</span>}
                                                </div>
                                                <div className="flex gap-1">
                                                    <button onClick={(e) => { e.stopPropagation(); onShiftTime(item.id); }} title="將此行程與後續行程延後 30 分鐘" className="p-1 md:p-1.5 hover:bg-indigo-50 rounded-lg text-indigo-400 hover:text-indigo-600 transition-colors font-black text-[9px] md:text-[10px]">+30分</button>
                                                    <button onClick={(e) => { e.stopPropagation(); onEdit(item); }} className="p-1 md:p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-blue-600 transition-colors"><Icon name="edit-3" className="w-3.5 h-3.5 md:w-4 md:h-4" /></button>
                                                    <button onClick={(e) => { e.stopPropagation(); onDelete(item.id); }} className="p-1 md:p-1.5 hover:bg-red-50 rounded-lg text-red-300 hover:text-red-600 transition-colors"><Icon name="trash-2" className="w-3.5 h-3.5 md:w-4 md:h-4" /></button>
                                                </div>
                                            </div>
                                            <h3 className="font-bold text-sm md:text-lg mb-2 md:mb-3 text-slate-800 leading-tight group-hover:text-blue-600 transition-colors">{item.content}</h3>
                                            <div className="flex flex-wrap gap-1.5 md:gap-2 items-center">
                                                <div className="flex items-center gap-1 text-[10px] md:text-xs text-slate-500 bg-white border border-slate-200 px-2 py-1 md:px-2.5 md:py-1.5 rounded-md"><Icon name="user" className="w-3 h-3 md:w-3.5 md:h-3.5" /> {item.member}</div>
                                                <div className="text-[10px] md:text-xs flex items-center gap-1 text-blue-600 font-black bg-blue-50 px-2 py-1 md:px-2.5 md:py-1.5 rounded-md transition-colors truncate max-w-full"><Icon name="map-pin" className="w-3 h-3 md:w-3.5 md:h-3.5 flex-shrink-0" /> <span className="truncate">{item.location}</span></div>
                                            </div>
                                        </div>
                                    )})}
                            </div>
                        </React.Fragment>
                    ) : (
                        <React.Fragment>
                            <div className="p-3 md:p-4 border-b border-slate-200 bg-white z-10 shadow-sm flex-shrink-0">
                                <h2 className="font-black text-sm md:text-base text-slate-800 mb-1 md:mb-2 flex items-center gap-1.5"><Icon name="route" className="w-4 h-4 md:w-5 md:h-5 text-blue-600"/> 顯示路線</h2>
                                <div className="grid grid-cols-3 gap-1.5 md:gap-2 mt-1.5 md:mt-2">
                                    {[1,2,3,4,5,6].map(d => (
                                        <label key={d} className={`flex items-center gap-1.5 p-1.5 md:p-2 rounded-lg border-2 cursor-pointer transition-all active:scale-95 ${routeDays.includes(d) ? 'border-slate-300 bg-slate-50 shadow-sm' : 'border-slate-100 opacity-60 bg-white'}`}>
                                            <input type="checkbox" checked={routeDays.includes(d)} onChange={() => toggleRouteDay(d)} className="w-3 h-3 md:w-4 md:h-4 rounded text-blue-600 focus:ring-blue-500 route-checkbox" />
                                            <div className="w-2 h-2 md:w-3 md:h-3 rounded-full shadow-sm flex-shrink-0" style={{backgroundColor: DAY_COLORS[d]}}></div>
                                            <span className="font-bold text-slate-700 text-[10px] md:text-sm whitespace-nowrap">D{d}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto p-3 md:p-4 space-y-4 md:space-y-5 custom-scrollbar bg-slate-50 pb-10">
                                {routeDays.map(d => {
                                    const items = itinerary.filter(i => i.day === d).sort((a,b) => a.time.localeCompare(b.time));
                                    if (items.length === 0) return null;
                                    return (
                                        <div key={d} className="relative">
                                            <div className="absolute left-[11px] md:left-[13px] top-6 bottom-0 w-0.5 md:w-1 bg-slate-200/80 rounded-full"></div>
                                            <h3 className="font-black text-[11px] md:text-sm mb-2.5 md:mb-4 flex items-center gap-1.5 md:gap-2 px-2.5 py-1 md:px-3 md:py-1.5 bg-white rounded-lg shadow-sm border border-slate-100 inline-flex" style={{color: DAY_COLORS[d]}}><div className="w-2 h-2 md:w-2.5 md:h-2.5 rounded-full" style={{backgroundColor: DAY_COLORS[d]}}></div>Day {d} 停靠點與車程</h3>
                                            <div className="space-y-0">
                                                {items.map((item, idx) => (
                                                    <React.Fragment key={item.id}>
                                                        <div className="flex gap-2.5 md:gap-3 relative z-10 pl-0.5 cursor-pointer group active:scale-[0.98] transition-transform" onClick={() => onFocus(item)}>
                                                            <div className="w-[20px] h-[20px] md:w-[26px] md:h-[26px] rounded-full text-white flex items-center justify-center text-[10px] md:text-xs font-bold flex-shrink-0 shadow-md mt-1 md:mt-1.5" style={{backgroundColor: DAY_COLORS[d]}}>{idx + 1}</div>
                                                            <div className="bg-white p-2 md:p-3 rounded-xl md:rounded-2xl shadow-sm border border-slate-100 w-full overflow-hidden group-hover:border-blue-300 transition-colors">
                                                                <div className="text-[10px] md:text-xs font-black text-slate-400 mb-0.5 md:mb-1"><Icon name="clock" className="w-2.5 h-2.5 md:w-3 md:h-3 inline pb-0.5"/> {item.time}</div>
                                                                <div className="text-xs md:text-base font-bold text-slate-700 truncate leading-tight group-hover:text-blue-600 transition-colors">{item.location || item.content}</div>
                                                            </div>
                                                        </div>
                                                        {idx < items.length - 1 && routeMetrics[d] && routeMetrics[d][idx] && (
                                                            <div className="flex items-center gap-1.5 md:gap-2 py-1 md:py-2 pl-[32px] md:pl-[38px] text-[9px] md:text-[11px] font-bold text-slate-500">
                                                                <div className="bg-slate-200 rounded-md px-1.5 py-0.5 md:px-2 md:py-1 flex items-center gap-1 md:gap-1.5 shadow-inner">
                                                                    <Icon name="car" className="w-2.5 h-2.5 md:w-3 md:h-3" /> 車程約 {Math.round(routeMetrics[d][idx].duration / 60)} 分 ({(routeMetrics[d][idx].distance / 1000).toFixed(1)} km)
                                                                </div>
                                                            </div>
                                                        )}
                                                        {idx < items.length - 1 && (!routeMetrics[d] || !routeMetrics[d][idx]) && <div className="py-1"></div>}
                                                    </React.Fragment>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </React.Fragment>
                    )}
                </div>
            );
        };

        const App = () => {
            const { itinerary, loading, isLocalMode, saveItem, deleteItem, batchUpdate } = useFirebase();
            const [viewMode, setViewMode] = useState('itinerary'); 
            const [activeDay, setActiveDay] = useState(1);
            const [routeDays, setRouteDays] = useState([1, 2, 3, 4, 5, 6]);
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
            const [mapHeightVH, setMapHeightVH] = useState(40);
            
            const [toastMsg, setToastMsg] = useState({ msg: '', show: false });
            const [selectedLocation, setSelectedLocation] = useState(null);
            const [routeMetrics, setRouteMetrics] = useState({});
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [urlWarning, setUrlWarning] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);
            const [formData, setFormData] = useState({ day: 1, time: '09:00', content: '', location: '', url: '', lat: 26.2124, lng: 127.6809, member: MEMBERS[0], type: 'main', subType: 'attraction' });

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const showToast = (msg) => { setToastMsg({ msg, show: true }); setTimeout(() => setToastMsg({ msg: '', show: false }), 3000); };

            const handleMapDragStart = (e) => {
                if (e.type === 'mousedown' && e.button !== 0) return;
                const startY = e.touches ? e.touches[0].clientY : e.clientY;
                const startVh = mapHeightVH;
                const vhPixels = window.innerHeight / 100;
                const handleMove = (moveEvent) => {
                    if (moveEvent.cancelable) moveEvent.preventDefault();
                    const currentY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
                    setMapHeightVH(Math.max(15, Math.min(startVh + ((currentY - startY) / vhPixels), 75)));
                };
                const handleEnd = () => {
                    window.removeEventListener('mousemove', handleMove); window.removeEventListener('mouseup', handleEnd);
                    window.removeEventListener('touchmove', handleMove); window.removeEventListener('touchend', handleEnd);
                };
                window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);
                window.addEventListener('touchmove', handleMove, { passive: false }); window.addEventListener('touchend', handleEnd);
            };

            const handleDragDrop = async (draggedId, targetId) => {
                const draggedItem = itinerary.find(i => i.id === draggedId);
                const targetItem = itinerary.find(i => i.id === targetId);
                if (!draggedItem || !targetItem) return;
                await batchUpdate([{ id: draggedId, time: targetItem.time }, { id: targetId, time: draggedItem.time }]);
            };

            const handleShiftTime = async (startItemId, shiftMinutes = 30) => {
                const dayItems = itinerary.filter(i => i.day === activeDay).sort((a,b)=>a.time.localeCompare(b.time));
                const startIndex = dayItems.findIndex(i => i.id === startItemId);
                if(startIndex === -1) return;
                const updates = [];
                for(let i = startIndex; i < dayItems.length; i++) {
                    const item = dayItems[i];
                    const [hh, mm] = item.time.split(':').map(Number);
                    const d = new Date(2000, 0, 1, hh, mm);
                    d.setMinutes(d.getMinutes() + shiftMinutes);
                    updates.push({ id: item.id, time: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` });
                }
                await batchUpdate(updates);
                showToast(`✅ 已將此行程與後續行程順延 ${shiftMinutes} 分鐘`);
            };

            const handleGenerateContent = async () => {
                if (!formData.location) return;
                setIsGenerating(true);
                const result = await callGeminiWithBackoff(`你是專業旅遊達人。請為沖繩景點「${formData.location}」寫一句吸引人的行程短描述。繁體中文，限 15 字以內，不要引號。`);
                setFormData(p => ({ ...p, content: result.trim() }));
                setIsGenerating(false);
            };

            const handleUrlBlur = (e) => {
                const url = e.target.value;
                if (!url) return setUrlWarning("");
                const mAt = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/), m3d = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
                if (mAt) { setFormData(p => ({...p, lat: parseFloat(mAt[1]), lng: parseFloat(mAt[2])})); setUrlWarning(""); }
                else if (m3d) { setFormData(p => ({...p, lat: parseFloat(m3d[1]), lng: parseFloat(m3d[2])})); setUrlWarning(""); }
                else if (url.includes('goo.gl') || url.includes('maps.app.goo.gl')) setUrlWarning('短網址無法自動解析！請手動填寫。');
                else setUrlWarning('無法從此網址找到座標，請手動填寫！');
            };

            const handleSaveForm = async (e) => {
                e.preventDefault();
                const { id, ...cleanData } = formData;
                const data = { ...cleanData, day: parseInt(formData.day), lat: parseFloat(formData.lat) || 26.2124, lng: parseFloat(formData.lng) || 127.6809 };
                if (editingItem) data.id = editingItem.id;
                await saveItem(data, !!editingItem);
                setIsModalOpen(false); setEditingItem(null);
                setFormData({ day: activeDay, time: '09:00', content: '', location: '', url: '', lat: 26.2124, lng: 127.6809, member: MEMBERS[0], type: 'main', subType: 'attraction' });
            };

            if (loading) return <div className="flex h-full items-center justify-center"><div className="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div></div>;

            return (
                <div className="h-full flex flex-col w-full bg-slate-50">
                    <Toast message={toastMsg.msg} visible={toastMsg.show} />
                    <Header isLocalMode={isLocalMode} viewMode={viewMode} setViewMode={setViewMode} onOpenModal={() => { setEditingItem(null); setIsModalOpen(true); setUrlWarning(""); }} />
                    
                    <div className="flex flex-col md:flex-row flex-1 overflow-hidden">
                        <MapArea itinerary={itinerary} viewMode={viewMode} activeDay={activeDay} routeDays={routeDays} selectedLocation={selectedLocation} isMobile={isMobile} mapHeightVH={mapHeightVH} setRouteMetrics={setRouteMetrics} />
                        {isMobile && <div className="w-full h-4 bg-slate-100 flex items-center justify-center cursor-row-resize z-20 order-2 flex-shrink-0 border-y border-slate-200 touch-none relative" onMouseDown={handleMapDragStart} onTouchStart={handleMapDragStart}><div className="w-10 h-1 bg-slate-300 rounded-full"></div><div className="absolute inset-x-0 -top-3 -bottom-3"></div></div>}
                        <Sidebar itinerary={itinerary} viewMode={viewMode} activeDay={activeDay} setActiveDay={setActiveDay} routeDays={routeDays} toggleRouteDay={(d) => setRouteDays(p => p.includes(d) ? p.filter(x=>x!==d) : [...p,d].sort())} onEdit={(i) => { setEditingItem(i); setFormData(i); setIsModalOpen(true); }} onDelete={id => confirm('確定要刪除嗎？') && deleteItem(id)} onShiftTime={handleShiftTime} onDragDrop={handleDragDrop} onFocus={setSelectedLocation} routeMetrics={routeMetrics} showToast={showToast} />
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[3000] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm" onClick={() => setIsModalOpen(false)}>
                            <div className="bg-white rounded-[32px] w-full max-w-md shadow-2xl overflow-hidden animate-in zoom-in duration-300 flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                                <div className="bg-slate-900 p-5 text-white flex justify-between items-center flex-shrink-0"><h2 className="text-base font-black">{editingItem ? '編輯行程' : '新增行程'}</h2><button onClick={() => setIsModalOpen(false)}><Icon name="x" className="w-5 h-5"/></button></div>
                                <form onSubmit={handleSaveForm} className="p-6 space-y-4 overflow-y-auto custom-scrollbar flex-1 pb-10">
                                    <div className="flex gap-3">
                                        <div className="flex-1"><label className="text-xs font-black text-slate-400 mb-1 block uppercase">Day</label><select value={formData.day} onChange={e => setFormData({...formData, day: e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500 bg-white">{[1,2,3,4,5,6].map(d=><option key={d} value={d}>Day {d}</option>)}</select></div>
                                        <div className="flex-1"><label className="text-xs font-black text-slate-400 mb-1 block uppercase">Time</label>
                                            <div className="flex items-center gap-1.5">
                                                <select value={(formData.time||'09:00').split(':')[0]} onChange={e => setFormData({...formData, time: `${e.target.value}:${(formData.time||'09:00').split(':')[1]}`})} className="flex-1 border-2 border-slate-100 rounded-xl py-2.5 px-2 font-bold outline-none focus:border-blue-500 bg-white text-center">{Array.from({length:24},(_,i)=>i.toString().padStart(2,'0')).map(h=><option key={h} value={h}>{h}</option>)}</select><span>:</span>
                                                <select value={(formData.time||'09:00').split(':')[1]} onChange={e => setFormData({...formData, time: `${(formData.time||'09:00').split(':')[0]}:${e.target.value}`})} className="flex-1 border-2 border-slate-100 rounded-xl py-2.5 px-2 font-bold outline-none focus:border-blue-500 bg-white text-center">{Array.from({length:60},(_,i)=>i.toString().padStart(2,'0')).map(m=><option key={m} value={m}>{m}</option>)}</select>
                                            </div>
                                        </div>
                                    </div>
                                    <div><label className="text-xs font-black text-slate-400 mb-1.5 block uppercase">負責人</label><div className="grid grid-cols-3 gap-2">{MEMBERS.map(m => <button type="button" key={m} onClick={()=>setFormData({...formData, member:m})} className={`py-2 rounded-xl text-sm font-black border-2 ${formData.member===m?'bg-blue-600 border-blue-600 text-white':'bg-white text-slate-500'}`}>{m}</button>)}</div></div>
                                    <div>
                                        <label className="text-xs font-black text-slate-400 mb-1.5 block uppercase">類別與子類別</label>
                                        <div className="flex gap-2 mb-2">
                                            <button type="button" onClick={()=>setFormData({...formData, type:'main'})} className={`flex-1 py-2.5 rounded-xl text-sm font-black border-2 ${formData.type==='main'?'bg-slate-800 border-slate-800 text-white':'bg-white text-slate-500'}`}>主要行程</button>
                                            <button type="button" onClick={()=>setFormData({...formData, type:'backup'})} className={`flex-1 py-2.5 rounded-xl text-sm font-black border-2 ${formData.type==='backup'?'bg-amber-500 border-amber-500 text-white':'bg-white text-slate-500'}`}>備選景點</button>
                                        </div>
                                        <div className="grid grid-cols-4 gap-2">{Object.entries(SUB_TYPES).map(([k,i])=><button type="button" key={k} onClick={()=>setFormData({...formData, subType:k})} className={`py-2 rounded-xl text-[11px] font-black border-2 flex flex-col items-center gap-1 ${formData.subType===k?`${i.badgeBg} ${i.border} ${i.badgeText}`:'bg-white text-slate-400'}`}><Icon name={i.icon} className="w-4 h-4"/>{i.label}</button>)}</div>
                                    </div>
                                    <div><label className="text-xs font-black text-slate-400 mb-1 block uppercase">地點名稱</label><input type="text" value={formData.location} onChange={e=>setFormData({...formData, location:e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500 text-base" /></div>
                                    <div className="bg-purple-50/50 p-4 rounded-2xl border-2 border-purple-100/50"><label className="text-[11px] font-black text-purple-700 mb-1 block uppercase">行程內容</label><div className="flex gap-2"><input type="text" required value={formData.content} onChange={e=>setFormData({...formData, content:e.target.value})} className="flex-1 w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500 text-base" /><button type="button" onClick={handleGenerateContent} disabled={!formData.location||isGenerating} className="bg-purple-100 text-purple-700 font-bold px-3 rounded-xl border-2 hover:bg-purple-200 flex items-center justify-center gap-1">{isGenerating ? <Icon name="loader-2" className="w-4 h-4 icon-spin"/> : "✨ AI 幫寫"}</button></div></div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-100"><label className="text-xs font-black text-blue-600 mb-2 block uppercase">Google Map 連結</label><input type="url" placeholder="貼上完整網址自動填座標..." value={formData.url} onChange={e=>{setFormData({...formData, url:e.target.value});setUrlWarning("");}} onBlur={handleUrlBlur} className="w-full border-2 border-slate-200 rounded-xl p-2.5 bg-white mb-2 text-sm outline-none focus:border-blue-300" />{urlWarning && <div className="text-red-500 text-[11px] font-bold mb-2">{urlWarning}</div>}<div className="grid grid-cols-2 gap-3"><input type="number" step="any" value={formData.lat} onChange={e=>setFormData({...formData, lat:e.target.value})} className="w-full border-2 border-slate-200 rounded-lg p-2 text-sm font-mono" placeholder="Lat"/><input type="number" step="any" value={formData.lng} onChange={e=>setFormData({...formData, lng:e.target.value})} className="w-full border-2 border-slate-200 rounded-lg p-2 text-sm font-mono" placeholder="Lng"/></div></div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-blue-600 transition-all flex items-center justify-center gap-2 mt-4 text-lg"><Icon name="save" /> 儲存行程</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
