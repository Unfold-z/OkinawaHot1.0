<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>沖繩 6 日自駕之旅 - 互動行程與路線地圖</title>
    <!-- 引入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* 鎖定全螢幕，採用 App 式佈局 */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f8fafc; }
        #root { height: 100%; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 自訂捲軸 */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 地圖樣式覆寫 */
        .leaflet-div-icon { background: transparent; border: none; }
        .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); overflow: hidden; }
        .leaflet-popup-content { margin: 0; }
        
        /* 地圖標記懸停動畫 */
        .marker-anim { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .marker-anim:hover { transform: scale(1.2); z-index: 1000 !important; }

        /* 導航路線動畫 */
        .route-line { stroke-dasharray: 15, 15; animation: dash 30s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -1000; } }

        /* 防止行動端點擊閃爍與縮放 */
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        input, select, textarea { font-size: 16px !important; }
        
        .route-checkbox:checked + div { border-color: transparent; }
        
        /* 旋轉動畫(供讀取中圖示使用) */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .icon-spin { animation: spin 1s linear infinite; }

        /* 拖曳動畫提示 */
        .drag-over { border: 2px dashed #3b82f6 !important; opacity: 0.7; transform: scale(0.98); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Gemini API Helper (具備指數退避重試機制) ---
        const callGeminiWithBackoff = async (prompt, maxRetries = 5) => {
            const apiKey = ""; // 執行環境會自動注入
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "無法產生內容。";
                } catch (error) {
                    if (i === maxRetries - 1) return "API 呼叫失敗，請稍後再試。";
                    await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000));
                }
            }
        };

        const getFirebaseConfig = () => {
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    return JSON.parse(__firebase_config);
                }
            } catch (e) {
                console.warn("未偵測到環境變數。");
            }
            return null;
        };

        const firebaseConfig = getFirebaseConfig();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'okinawa-trip-2025';
        const MEMBERS = ["志展", "盧志", "大維", "禹康", "懿軒"];

        const SUB_TYPES = {
            attraction: { label: '景點', color: '#3b82f6', icon: 'camera', badgeBg: 'bg-blue-100', badgeText: 'text-blue-700', border: 'border-blue-500' },
            food: { label: '食物', color: '#ef4444', icon: 'utensils', badgeBg: 'bg-red-100', badgeText: 'text-red-700', border: 'border-red-500' },
            shopping: { label: '購物', color: '#a855f7', icon: 'shopping-bag', badgeBg: 'bg-purple-100', badgeText: 'text-purple-700', border: 'border-purple-500' },
            accommodation: { label: '住宿', color: '#f97316', icon: 'bed', badgeBg: 'bg-orange-100', badgeText: 'text-orange-700', border: 'border-orange-500' }
        };
        
        const DAY_COLORS = {
            1: '#3b82f6', 2: '#10b981', 3: '#ef4444', 
            4: '#f59e0b', 5: '#8b5cf6', 6: '#ec4899'
        };

        const INITIAL_ITINERARY = [
            { id: 'seed_1', day: 1, time: '19:45', content: '全員抵達那霸機場、飯店 Check-in', location: '那霸機場', url: 'https://www.google.com/maps/search/?api=1&query=那霸機場', lat: 26.2064, lng: 127.6465, member: '志展', type: 'main', subType: 'accommodation' },
            { id: 'seed_2', day: 1, time: '21:30', content: '晚餐：Torijin Naha (鳥神串燒)', location: 'Torijin Naha', url: 'https://www.google.com/maps/search/?api=1&query=那覇+焼き鳥+鳥神', lat: 26.2155, lng: 127.6792, member: '盧志', type: 'main', subType: 'food' },
            { id: 'seed_3', day: 2, time: '09:00', content: '市區取車 → 波上宮', location: '波上宮', url: 'https://www.google.com/maps/search/?api=1&query=波上宮', lat: 26.2207, lng: 127.6711, member: '大維', type: 'main', subType: 'attraction' },
            { id: 'seed_4', day: 2, time: '11:30', content: '午餐：漁師食堂 (海鮮)', location: '漁師食堂', url: 'https://www.google.com/maps/search/?api=1&query=漁師食堂+大木海產物', lat: 26.3456, lng: 127.7890, member: '禹康', type: 'main', subType: 'food' },
            { id: 'seed_5', day: 2, time: '14:00', content: '購物：PARCO CITY', location: 'PARCO CITY', url: 'https://www.google.com/maps/search/?api=1&query=浦添西海岸+PARCO+CITY', lat: 26.2625, lng: 127.6975, member: '懿軒', type: 'main', subType: 'shopping' },
            { id: 'seed_6', day: 3, time: '10:00', content: '重點：美麗海水族館', location: '美麗海水族館', url: 'https://www.google.com/maps/search/?api=1&query=沖縄美ら海水族館', lat: 26.6944, lng: 127.8779, member: '大維', type: 'main', subType: 'attraction' },
            { id: 'seed_7', day: 4, time: '12:00', content: '散策：美國村深度漫遊', location: '美國村', url: 'https://www.google.com/maps/search/?api=1&query=北谷美浜アメリカンビレッジ', lat: 26.3163, lng: 127.7576, member: '盧志', type: 'main', subType: 'attraction' },
            { id: 'seed_8', day: 5, time: '10:30', content: '景點：沖繩世界 (玉泉洞)', location: '沖繩世界', url: 'https://www.google.com/maps/search/?api=1&query=おきなわワールド', lat: 26.1397, lng: 127.7503, member: '志展', type: 'main', subType: 'attraction' },
            { id: 'seed_9', day: 6, time: '09:30', content: '景點：首里城參觀', location: '首里城', url: 'https://www.google.com/maps/search/?api=1&query=首里城', lat: 26.2170, lng: 127.7194, member: '懿軒', type: 'main', subType: 'attraction' }
        ];

        // 核心修復：使用 span wrapper 防止 React 試圖 unmount 已被 Lucide 替換的 DOM 元素
        const Icon = ({ name, className = "w-4 h-4" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);

            return <span ref={iconRef} style={{ display: 'contents' }}></span>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [itinerary, setItinerary] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [isLocalMode, setIsLocalMode] = useState(!firebaseConfig);
            
            const [viewMode, setViewMode] = useState('itinerary'); 
            const [activeDay, setActiveDay] = useState(1);
            const [routeDays, setRouteDays] = useState([1, 2, 3, 4, 5, 6]);
            const [urlWarning, setUrlWarning] = useState("");
            
            // --- OSRM 車程距離估算 ---
            const [routeMetrics, setRouteMetrics] = useState({});

            // --- 拖曳排序 ---
            const [draggedItemId, setDraggedItemId] = useState(null);

            // --- 天氣預報 ---
            const [weatherData, setWeatherData] = useState(null);
            
            // --- Gemini 狀態 ---
            const [isGeneratingContent, setIsGeneratingContent] = useState(false);
            const [isGettingAdvice, setIsGettingAdvice] = useState(false);
            const [aiAdviceMap, setAiAdviceMap] = useState({});

            const [formData, setFormData] = useState({
                day: 1, time: '09:00', content: '', location: '', url: '', lat: 26.2124, lng: 127.6809, member: MEMBERS[0], type: 'main', subType: 'attraction'
            });

            const mapRef = useRef(null);
            const markersRef = useRef([]);
            const polylinesRef = useRef([]);
            const leafletMap = useRef(null);

            // --- 智慧天氣預報邏輯 ---
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        // 沖繩 2026-05-23 出發行程
                        const tripStartDateStr = '2026-05-23';
                        const tripDate = new Date(tripStartDateStr);
                        const today = new Date();
                        const diffDays = (tripDate - today) / (1000 * 60 * 60 * 24);

                        let url = '';
                        let isHistorical = false;

                        if (diffDays > 14) {
                            // 大於 14 天無真實預報，抓去年同期 (2025-05-23 ~ 2025-05-28)
                            url = 'https://archive-api.open-meteo.com/v1/archive?latitude=26.2124&longitude=127.6809&start_date=2025-05-23&end_date=2025-05-28&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo';
                            isHistorical = true;
                        } else if (diffDays >= 0 && diffDays <= 14) {
                            // 14天內，抓取該區間真實預報
                            const endDate = new Date(tripDate);
                            endDate.setDate(endDate.getDate() + 5);
                            const startStr = tripDate.toISOString().split('T')[0];
                            const endStr = endDate.toISOString().split('T')[0];
                            url = `https://api.open-meteo.com/v1/forecast?latitude=26.2124&longitude=127.6809&start_date=${startStr}&end_date=${endStr}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
                        } else {
                            // 行程已過或測試用，預設抓未來7天
                            url = 'https://api.open-meteo.com/v1/forecast?latitude=26.2124&longitude=127.6809&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo';
                        }

                        const res = await fetch(url);
                        const data = await res.json();
                        if(data.daily) {
                            setWeatherData({ daily: data.daily, isHistorical });
                        }
                    } catch(e) { console.error('天氣資訊取得失敗:', e); }
                };
                fetchWeather();
            }, []);

            const getWeatherIconName = (code) => {
                if (code === undefined) return 'sun';
                if (code <= 1) return 'sun';
                if (code <= 3) return 'cloud-sun';
                if (code <= 48) return 'cloud';
                if (code <= 67 || (code >= 80 && code <= 82)) return 'cloud-rain';
                if (code <= 77 || code === 85 || code === 86) return 'snowflake';
                if (code >= 95) return 'cloud-lightning';
                return 'sun';
            };

            useEffect(() => {
                if (!firebaseConfig) {
                    setLoading(false);
                    return;
                }
                const setupFirebase = async () => {
                    try {
                        const app = firebase.apps.length > 0 ? firebase.app() : firebase.initializeApp(firebaseConfig);
                        const auth = firebase.auth();
                        const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                            if (u) {
                                setUser(u);
                            } else {
                                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                    auth.signInWithCustomToken(__initial_auth_token).catch(() => auth.signInAnonymously());
                                } else {
                                    auth.signInAnonymously();
                                }
                            }
                        });
                        return () => unsubscribeAuth();
                    } catch (err) {
                        console.error("Firebase Setup Error:", err);
                        setIsLocalMode(true);
                        setLoading(false);
                    }
                };
                setupFirebase();
            }, []);

            useEffect(() => {
                if (isLocalMode) {
                    setItinerary(INITIAL_ITINERARY);
                    setLoading(false);
                    return;
                }
                if (!user) return;
                const db = firebase.firestore();
                const itineraryCol = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerary');
                const unsubscribeData = itineraryCol.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                    if (data.length > 0) {
                        const sorted = data.sort((a, b) => {
                            if (a.day !== b.day) return a.day - b.day;
                            return a.time.localeCompare(b.time);
                        });
                        setItinerary(sorted);
                    } else {
                        INITIAL_ITINERARY.forEach(item => {
                            const { id, ...itemData } = item;
                            itineraryCol.doc(id).set(itemData);
                        });
                    }
                    setLoading(false);
                }, (err) => {
                    console.error("Firestore Error:", err);
                    setLoading(false);
                });
                return () => unsubscribeData();
            }, [user, isLocalMode]);

            useEffect(() => {
                if (!leafletMap.current && mapRef.current) {
                    leafletMap.current = L.map(mapRef.current, {
                        zoomControl: true,
                        scrollWheelZoom: true
                    }).setView([26.4, 127.8], 9);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(leafletMap.current);
                }

                let isActive = true;

                const updateMapDisplay = async () => {
                    if (!leafletMap.current) return;
                    leafletMap.current.invalidateSize();
                    
                    // 清除舊標記與連線
                    markersRef.current.forEach(m => m.remove());
                    markersRef.current = [];
                    polylinesRef.current.forEach(p => p.remove());
                    polylinesRef.current = [];

                    const daysToRender = viewMode === 'route' ? routeDays : [activeDay];
                    const newMetrics = {};
                    
                    for (const day of daysToRender) {
                        const dayItems = itinerary.filter(i => i.day === day).sort((a,b) => a.time.localeCompare(b.time));
                        const validItems = dayItems.filter(i => i.lat && i.lng);
                        const latlngs = validItems.map(i => [i.lat, i.lng]);

                        // 繪製標記 (Markers)
                        validItems.forEach((item, index) => {
                            const sub = SUB_TYPES[item.subType] || SUB_TYPES.attraction;
                            const borderColor = item.type === 'backup' ? '#f59e0b' : '#ffffff';
                            
                            let html = '';
                            if (viewMode === 'route') {
                                const bgColor = DAY_COLORS[day];
                                html = `<div class="marker-anim flex items-center justify-center text-white font-bold" style="background-color: ${bgColor}; width: 22px; height: 22px; border: 2.5px solid ${borderColor}; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4); font-size: 11px;">${index + 1}</div>`;
                            } else {
                                html = `<div class="marker-anim" style="background-color: ${sub.color}; width: 14px; height: 14px; border: 2.5px solid ${borderColor}; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4);"></div>`;
                            }
                            
                            const iconSize = viewMode === 'route' ? [22, 22] : [14, 14];
                            const iconAnchor = viewMode === 'route' ? [11, 11] : [7, 7];
                            const icon = L.divIcon({ html, className: '', iconSize, iconAnchor });

                            const marker = L.marker([item.lat, item.lng], { icon })
                                .addTo(leafletMap.current)
                                .bindPopup(`
                                    <div class="p-1.5 md:p-2 min-w-[150px] md:min-w-[180px]">
                                        <div class="flex items-center gap-1 mb-2">
                                            <span class="text-[10px] px-2 py-0.5 rounded ${sub.badgeBg} ${sub.badgeText} font-bold">
                                                ${sub.label}
                                            </span>
                                            ${item.type === 'backup' ? `<span class="text-[10px] px-2 py-0.5 rounded bg-amber-100 text-amber-700 font-bold border border-amber-200">備選</span>` : ''}
                                            <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-medium ml-auto">${item.member}</span>
                                        </div>
                                        <h3 class="font-bold text-sm text-slate-800 mb-1 leading-tight truncate">${item.location || item.content}</h3>
                                        ${item.location ? `<p class="text-xs text-gray-500 mb-3 leading-tight line-clamp-2">${item.content}</p>` : ''}
                                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" style="color: #ffffff !important;"
                                           class="text-[11px] md:text-xs bg-blue-600 px-2 py-2 md:py-2.5 rounded-lg block text-center font-black shadow-md hover:bg-blue-700 active:scale-95 transition-all uppercase tracking-widest text-white mt-1">
                                           開啟導航
                                        </a>
                                    </div>
                                `, { closeButton: false, autoPanPadding: [20, 20] });
                            markersRef.current.push(marker);
                        });

                        // 非同步繪製真實道路連線 (OSRM API)
                        if (latlngs.length > 1) {
                            const routeColor = viewMode === 'route' ? DAY_COLORS[day] : '#64748b';
                            try {
                                const coordsString = latlngs.map(ll => `${ll[1]},${ll[0]}`).join(';');
                                const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordsString}?overview=full&geometries=geojson`);
                                const data = await response.json();

                                if (!isActive) return;

                                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                                    // 儲存導航距離與時間
                                    newMetrics[day] = data.routes[0].legs;

                                    const routeCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                                    const routeLine = L.polyline(routeCoords, {
                                        color: routeColor,
                                        weight: 5,
                                        opacity: 0.7,
                                        className: 'route-line'
                                    }).addTo(leafletMap.current);
                                    polylinesRef.current.push(routeLine);
                                } else {
                                    throw new Error('無法取得道路導航');
                                }
                            } catch (err) {
                                if (!isActive) return;
                                console.warn('道路導航失敗，退回直線連線', err);
                                const routeLine = L.polyline(latlngs, {
                                    color: routeColor,
                                    weight: 4,
                                    opacity: 0.6,
                                    dashArray: '10, 10',
                                    className: 'route-line'
                                }).addTo(leafletMap.current);
                                polylinesRef.current.push(routeLine);
                            }
                        }
                    }
                    setRouteMetrics(newMetrics);
                };

                const timer = setTimeout(updateMapDisplay, 100);
                return () => {
                    isActive = false;
                    clearTimeout(timer);
                };
            }, [itinerary, activeDay, viewMode, routeDays]);

            useEffect(() => {
                const handleResize = () => {
                    if(leafletMap.current) leafletMap.current.invalidateSize();
                }
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // --- 拖曳排序處理 ---
            const handleDragStart = (e, id) => {
                e.dataTransfer.setData('text/plain', id);
                setDraggedItemId(id);
            };

            const handleDragOver = (e) => {
                e.preventDefault(); // 允許放下
                e.currentTarget.classList.add('drag-over');
            };

            const handleDragLeave = (e) => {
                e.currentTarget.classList.remove('drag-over');
            };

            const handleDrop = async (e, targetId) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                
                const draggedId = e.dataTransfer.getData('text/plain');
                if (draggedId === targetId) return;

                const draggedItem = itinerary.find(i => i.id === draggedId);
                const targetItem = itinerary.find(i => i.id === targetId);

                if (!draggedItem || !targetItem) return;

                // 交換時間
                const tempTime = draggedItem.time;
                const updatedDragged = { ...draggedItem, time: targetItem.time };
                const updatedTarget = { ...targetItem, time: tempTime };

                // 樂觀更新 UI
                setItinerary(prev => prev.map(i => {
                    if (i.id === draggedId) return updatedDragged;
                    if (i.id === targetId) return updatedTarget;
                    return i;
                }).sort((a,b) => {
                    if(a.day !== b.day) return a.day - b.day;
                    return a.time.localeCompare(b.time);
                }));

                // 更新資料庫
                if (!isLocalMode) {
                    try {
                        const db = firebase.firestore();
                        const col = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerary');
                        await col.doc(draggedId).update({ time: updatedTarget.time });
                        await col.doc(targetId).update({ time: updatedDragged.time });
                    } catch (error) {
                        console.error('拖曳排序更新失敗:', error);
                    }
                }
                setDraggedItemId(null);
            };

            // --- AI 功能處理 ---
            const handleGenerateContent = async () => {
                if (!formData.location) return;
                setIsGeneratingContent(true);
                const prompt = `你是一個專業的旅遊達人。請為沖繩的景點或餐廳「${formData.location}」寫一句吸引人的行程標題或簡短描述。要求：繁體中文，限 15 個字以內，不要使用引號。`;
                const result = await callGeminiWithBackoff(prompt);
                setFormData(prev => ({ ...prev, content: result.trim() }));
                setIsGeneratingContent(false);
            };

            const handleGetDailyAdvice = async () => {
                const dayItems = itinerary.filter(i => i.day === activeDay).sort((a,b) => a.time.localeCompare(b.time));
                if (dayItems.length === 0) return;
                
                setIsGettingAdvice(true);
                const itineraryText = dayItems.map(i => `${i.time} - ${i.location || i.content}`).join('\n');
                const prompt = `你是一個專業的沖繩旅遊顧問。這是我規劃的第 ${activeDay} 天行程：\n${itineraryText}\n\n請用繁體中文給出一段約 50 字以內的簡短建議。可以指出行程順暢度、可能的問題（如拉車太久）、或是該地點的隱藏亮點。語氣要親切專業。`;
                
                const advice = await callGeminiWithBackoff(prompt);
                setAiAdviceMap(prev => ({ ...prev, [activeDay]: advice }));
                setIsGettingAdvice(false);
            };

            const handleUrlBlur = (e) => {
                const url = e.target.value;
                if (!url) {
                    setUrlWarning("");
                    return;
                }
                let lat = null;
                let lng = null;

                const matchAt = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                const match3d4d = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);

                if (matchAt) {
                    lat = parseFloat(matchAt[1]);
                    lng = parseFloat(matchAt[2]);
                } else if (match3d4d) {
                    lat = parseFloat(match3d4d[1]);
                    lng = parseFloat(match3d4d[2]);
                }

                if (lat !== null && lng !== null) {
                    setFormData(prev => ({ ...prev, lat, lng }));
                    setUrlWarning("");
                } else if (url.includes('goo.gl') || url.includes('maps.app.goo.gl')) {
                    setUrlWarning('短網址無法自動解析！請手動填寫座標，或在電腦版地圖複製「含 @經緯度」的完整網址。');
                } else {
                    setUrlWarning('無法從此網址找到座標，請手動填寫！');
                }
            };

            const handleSave = async (e) => {
                e.preventDefault();
                const { id, ...cleanFormData } = formData;
                const data = { 
                    ...cleanFormData, 
                    day: parseInt(formData.day), 
                    lat: parseFloat(formData.lat) || 26.2124, 
                    lng: parseFloat(formData.lng) || 127.6809 
                };

                if (isLocalMode) {
                    if (editingItem) {
                        setItinerary(prev => prev.map(i => i.id === editingItem.id ? { ...data, id: i.id } : i));
                    } else {
                        setItinerary(prev => [...prev, { ...data, id: Date.now().toString() }]);
                    }
                } else {
                    const db = firebase.firestore();
                    const itineraryCol = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerary');
                    if (editingItem) {
                        await itineraryCol.doc(editingItem.id).update(data);
                    } else {
                        await itineraryCol.add(data);
                    }
                }
                setIsModalOpen(false);
                setEditingItem(null);
                setFormData({ day: activeDay, time: '09:00', content: '', location: '', url: '', lat: 26.2124, lng: 127.6809, member: MEMBERS[0], type: 'main', subType: 'attraction' });

                        const p = m.getLatLng();
                        return Math.abs(p.lat - lat) < 0.0001 && Math.abs(p.lng - lng) < 0.0001;
                    });
                    if (marker) {
                        setTimeout(() => marker.openPopup(), 200);
                    }
                }
            };

                if (routeDays.includes(day)) {

                                    <span>{isLocalMode ? 'Offline Mode' : 'Real-time Sync'}</span>
                                    {weatherData?.isHistorical && <span className="text-amber-500">| 歷史同期天氣模式</span>}
                                </p>

                        <div className="w-full md:w-auto flex bg-slate-800 p-1 rounded-xl shadow-inner order-3 md:order-2 justify-center">

                            >
                                <Icon name="route" className="w-4 h-4" /> 路線地圖
                            </button>

                        <div className="w-auto flex justify-end order-2 md:order-3">
                            <button onClick={() => { setEditingItem(null); setIsModalOpen(true); setUrlWarning(""); }} className="bg-gradient-to-br from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 px-4 py-2 rounded-full font-bold text-sm flex items-center gap-1.5 shadow-lg active:scale-95 transition-all border border-blue-400/50">
                                <Icon name="plus" /> 新增
                            </button>

                                                   <strong className="text-indigo-800 block mb-1"><span className="text-[14px]">💡</span> 行程建議：</strong>
                                                   {aiAdviceMap[activeDay]}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-slate-50 pb-10">
                                        <p className="text-[10px] text-center text-slate-400 font-bold mb-2">💡 提示：按住卡片可上下拖曳排序</p>
                                        {itinerary.filter(i => i.day === activeDay).map((item) => {
                                            const sub = SUB_TYPES[item.subType] || SUB_TYPES.attraction;
                                            const borderClass = item.subType === 'food' ? 'border-red-500/30 border-l-red-500' : 
                                                                item.subType === 'shopping' ? 'border-purple-500/30 border-l-purple-500' : 
                                                                item.subType === 'accommodation' ? 'border-orange-500/30 border-l-orange-500' :
                                                                'border-blue-500/30 border-l-blue-500';
                                            const isDragging = draggedItemId === item.id;

                                            return (
                                            <div 
                                                key={item.id} 
                                                draggable={true}
                                                onDragStart={(e) => handleDragStart(e, item.id)}
                                                onDragOver={handleDragOver}
                                                onDragLeave={handleDragLeave}
                                                onDrop={(e) => handleDrop(e, item.id)}
                                                onClick={() => focusOn(item.lat, item.lng)}
                                                className={`group cursor-pointer bg-white border-2 rounded-2xl p-4 shadow-sm border-l-[6px] transition-all duration-200 active:scale-[0.98] md:hover:-translate-y-1 md:hover:shadow-md overflow-hidden ${borderClass} ${isDragging ? 'opacity-40' : ''}`}
                                            >
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        <span className="text-xs md:text-sm font-black text-slate-500 flex items-center gap-1 bg-slate-100 px-2.5 py-1 rounded-md"><Icon name="clock" className="w-3.5 h-3.5" /> {item.time}</span>
                                                        <span className={`text-xs px-2.5 py-1 rounded-md font-black flex items-center gap-1 ${sub.badgeBg} ${sub.badgeText}`}>
                                                            <Icon name={sub.icon} className="w-3 h-3" /> {sub.label}
                                                        </span>
                                                        {item.type === 'backup' && (
                                                            <span className="text-xs px-2.5 py-1 rounded-md font-black bg-amber-100 text-amber-700 border border-amber-200">備選</span>
                                                        )}
                                                    </div>
                                                    <div className="flex gap-1">
                                                        <button onClick={(e) => { e.stopPropagation(); setEditingItem(item); setFormData(item); setIsModalOpen(true); }} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-blue-600 transition-colors"><Icon name="edit-3" className="w-4 h-4" /></button>
                                                        <button onClick={async (e) => { 
                                                            e.stopPropagation();
                                                            if(confirm('確定要刪除嗎？')) {
                                                                if (isLocalMode) setItinerary(prev => prev.filter(i => i.id !== item.id));
                                                                else await firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerary').doc(item.id).delete();
                                                            }
                                                        }} className="p-1.5 hover:bg-red-50 rounded-lg text-red-300 hover:text-red-600 transition-colors"><Icon name="trash-2" className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                                <h3 className="font-bold text-lg mb-3 text-slate-800 leading-tight group-hover:text-blue-600 transition-colors">{item.content}</h3>
                                                <div className="flex flex-wrap gap-2 items-center">
                                                    <div className="flex items-center gap-1 text-xs text-slate-500 bg-white border border-slate-200 px-2.5 py-1.5 rounded-md">
                                                        <Icon name="user" className="w-3.5 h-3.5" /> {item.member}
                                                    </div>
                                                    <div className="text-xs flex items-center gap-1 text-blue-600 font-black bg-blue-50 px-2.5 py-1.5 rounded-md transition-colors truncate max-w-full">
                                                        <Icon name="map-pin" className="w-3.5 h-3.5 flex-shrink-0" /> <span className="truncate">{item.location}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        )})}
                                    </div>
                                </>
                            ) : (
                                <>

                                        <div className="p-4 border-b border-slate-200 bg-white z-10 shadow-sm flex-shrink-0">
                                            <h2 className="font-black text-base text-slate-800 mb-2 flex items-center gap-1.5"><Icon name="route" className="w-5 h-5 text-blue-600"/> 顯示路線</h2>
                                            <div className="grid grid-cols-3 gap-2 mt-2">
                                                {[1,2,3,4,5,6].map(d => (
                                                    <label key={d} className={`flex items-center gap-2 p-2 rounded-lg border-2 cursor-pointer transition-all active:scale-95 ${routeDays.includes(d) ? 'border-slate-300 bg-slate-50 shadow-sm' : 'border-slate-100 opacity-60 bg-white'}`}>
                                                        <input type="checkbox" checked={routeDays.includes(d)} onChange={() => toggleRouteDay(d)} className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 route-checkbox" />
                                                        <div className="w-3 h-3 rounded-full shadow-sm flex-shrink-0" style={{backgroundColor: DAY_COLORS[d]}}></div>
                                                        <span className="font-bold text-slate-700 text-sm whitespace-nowrap">D{d}</span>
                                                    </label>

                                                <select 
                                                    value={(formData.time || '09:00').split(':')[1] || '00'} 
                                                    onChange={e => setFormData({...formData, time: `${(formData.time || '09:00').split(':')[0]}:${e.target.value}`})} 
                                                    className="flex-1 border-2 border-slate-100 rounded-xl py-2.5 px-1 md:px-2.5 font-bold outline-none focus:border-blue-500 bg-white text-center"
                                                >
                                                    {Array.from({length: 60}, (_, i) => i.toString().padStart(2, '0')).map(m => <option key={m} value={m}>{m}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-black text-slate-400 mb-1.5 block uppercase">負責人</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {MEMBERS.map(m => (
                                                <button type="button" key={m} onClick={() => setFormData({...formData, member: m})} className={`py-2 rounded-xl text-sm font-black border-2 transition-all ${formData.member === m ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-100 text-slate-500 hover:bg-slate-50'}`}>{m}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-black text-slate-400 mb-1.5 block uppercase">類別與子類別</label>
                                        <div className="flex gap-2 mb-2">
                                            <button type="button" onClick={() => setFormData({...formData, type: 'main'})} className={`flex-1 py-2.5 rounded-xl text-sm font-black border-2 transition-all ${formData.type === 'main' ? 'bg-slate-800 border-slate-800 text-white shadow-md' : 'bg-white border-slate-100 text-slate-500 hover:bg-slate-50'}`}>主要行程</button>
                                            <button type="button" onClick={() => setFormData({...formData, type: 'backup'})} className={`flex-1 py-2.5 rounded-xl text-sm font-black border-2 transition-all ${formData.type === 'backup' ? 'bg-amber-500 border-amber-500 text-white shadow-md' : 'bg-white border-slate-100 text-slate-500 hover:bg-slate-50'}`}>備選景點</button>
                                        </div>
                                        <div className="grid grid-cols-4 gap-2">
                                            {Object.entries(SUB_TYPES).map(([key, info]) => (
                                                <button type="button" key={key} onClick={() => setFormData({...formData, subType: key})} className={`py-2 rounded-xl text-[11px] font-black border-2 flex flex-col items-center justify-center gap-1 transition-all ${formData.subType === key ? `${info.badgeBg} ${info.border} ${info.badgeText} shadow-sm` : 'bg-white border-slate-100 text-slate-400 hover:bg-slate-50'}`}>
                                                    <Icon name={info.icon} className="w-4 h-4" /> <span>{info.label}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-black text-slate-400 mb-1 block uppercase">地點名稱</label>
                                        <input type="text" placeholder="例：燒肉神社 那霸店" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500 text-base" />
                                    </div>

                                    {/* AI 生成行程內容 */}
                                    <div className="bg-purple-50/50 p-4 rounded-2xl border-2 border-purple-100/50">
                                        <label className="text-[11px] font-black text-purple-700 mb-1 block uppercase">行程內容</label>
                                        <div className="flex gap-2">
                                            <input type="text" required placeholder="例：享用頂級和牛" value={formData.content} onChange={e => setFormData({...formData, content: e.target.value})} className="flex-1 w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500 text-base" />
                                            <button 
                                                type="button" 
                                                onClick={handleGenerateContent} 
                                                disabled={!formData.location || isGeneratingContent}
                                                className="bg-purple-100 text-purple-700 font-bold px-3 md:px-4 rounded-xl border-2 border-purple-200 hover:bg-purple-200 disabled:opacity-50 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap active:scale-95"
                                            >
                                                {isGeneratingContent ? <Icon name="loader-2" className="w-4 h-4 icon-spin" /> : "✨ AI 幫寫"}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-100">
                                        <label className="text-xs font-black text-blue-600 mb-2 block uppercase">Google Map 連結 (自動填座標)</label>
                                        <input type="url" placeholder="貼上完整網址..." value={formData.url} onChange={e => { setFormData({...formData, url: e.target.value}); setUrlWarning(""); }} onBlur={handleUrlBlur} className="w-full border-2 border-slate-200 rounded-xl p-2.5 bg-white mb-2 text-sm outline-none focus:border-blue-300" />
                                        {urlWarning && <div className="text-red-500 text-[11px] font-bold mb-3 bg-red-50 p-2 rounded-lg border border-red-100">{urlWarning}</div>}
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="number" step="any" value={formData.lat} onChange={e => setFormData({...formData, lat: e.target.value})} className="w-full border-2 border-slate-200 rounded-lg p-2 text-sm font-mono" placeholder="Lat 緯度" />
                                            <input type="number" step="any" value={formData.lng} onChange={e => setFormData({...formData, lng: e.target.value})} className="w-full border-2 border-slate-200 rounded-lg p-2 text-sm font-mono" placeholder="Lng 經度" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-blue-600 transition-all flex items-center justify-center gap-2 mt-4 text-lg">
                                        <Icon name="save" /> 儲存行程
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
