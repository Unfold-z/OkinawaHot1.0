// 最小轉帳結算演算法
function settle(expenses, members) {
    const balance = {};
    members.forEach(m => balance[m] = 0);

    expenses.forEach(exp => {
        if (!exp.forWhom || exp.forWhom.length === 0) return; // guard: skip invalid records
        const perPerson = exp.amount / exp.forWhom.length;
        balance[exp.paidBy] = (balance[exp.paidBy] || 0) + Number(exp.amount);
        exp.forWhom.forEach(m => { balance[m] = (balance[m] || 0) - perPerson; });
    });

    const creditors = [], debtors = [];
    Object.entries(balance).forEach(([m, b]) => {
        if (b > 0.5)  creditors.push({m, b});
        if (b < -0.5) debtors.push({m, b: -b});
    });
    creditors.sort((a,b) => b.b - a.b);
    debtors.sort((a,b) => b.b - a.b);

    const txns = [];
    let ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length) {
        const c = creditors[ci], d = debtors[di];
        const amt = Math.min(c.b, d.b);
        if (amt > 0.5) txns.push({from: d.m, to: c.m, amount: amt});
        c.b -= amt; d.b -= amt;
        if (c.b < 0.5) ci++;
        if (d.b < 0.5) di++;
    }
    return txns;
}

    const [itinerary, setItinerary] = useState([]);
    const [expenses,  setExpenses]  = useState([]);
    const [isLocal,   setIsLocal]   = useState(true);
    const [loading,   setLoading]   = useState(true);
    const dbRef = useRef(null);

    useEffect(() => {
        let unsubIt, unsubEx;
        const init = async () => {
            if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes('請替換')) {
                setItinerary(INITIAL_ITINERARY); setIsLocal(true); setLoading(false); return;
            }
            try {
                const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
                await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                await firebase.auth().signInAnonymously();
                const db = firebase.firestore();
                dbRef.current = db;

                // Itinerary
                const itCol = db.collection('trips').doc(TRIP_ID).collection('itinerary');
                unsubIt = itCol.onSnapshot(snap => {
                    const data = snap.docs.map(d => ({...d.data(), id:d.id}));
                    if (data.length === 0) INITIAL_ITINERARY.forEach(({id,...item}) => itCol.doc(id).set(item));
                    else setItinerary(sortItems(data));
                    setIsLocal(false); setLoading(false);
                }, () => { setItinerary(INITIAL_ITINERARY); setIsLocal(true); setLoading(false); });

                // Expenses
                const exCol = db.collection('trips').doc(TRIP_ID).collection('expenses');
                unsubEx = exCol.onSnapshot(snap => {
                    setExpenses(snap.docs.map(d => ({...d.data(), id:d.id})).sort((a,b)=>b.createdAt-a.createdAt));
                }, () => {});

            } catch(e) {
                console.warn('Firebase failed, local mode', e);
                setItinerary(INITIAL_ITINERARY); setIsLocal(true); setLoading(false);
            }
        };
        init();
        return () => { unsubIt?.(); unsubEx?.(); };
    }, []);

    const getItCol = () => dbRef.current?.collection('trips').doc(TRIP_ID).collection('itinerary');
    const getExCol = () => dbRef.current?.collection('trips').doc(TRIP_ID).collection('expenses');

    const saveItem = async (data, isEdit) => {
        if (isLocal) {
            if (isEdit) setItinerary(p => sortItems(p.map(i => i.id===data.id ? data : i)));
            else        setItinerary(p => sortItems([...p, {...data, id:Date.now().toString()}]));
            return;
        }
        const col = getItCol();
        if (isEdit) { const {id,...u}=data; await col.doc(id).update(u); } else await col.add(data);
    };

    const deleteItem = async (id) => {
        if (isLocal) { setItinerary(p=>p.filter(i=>i.id!==id)); return; }
        await getItCol().doc(id).delete();
    };

    const batchUpdate = async (updates) => {
        if (isLocal) {
            setItinerary(p=>sortItems(p.map(item=>{const u=updates.find(x=>x.id===item.id);return u?{...item,...u}:item;})));
            return;
        }
        const db=dbRef.current, col=getItCol(), batch=db.batch();
        updates.forEach(({id,...fields})=>batch.update(col.doc(id),fields));
        await batch.commit();
    };

    const saveExpense = async (data, isEdit) => {
        const record = {...data, createdAt: isEdit ? data.createdAt : Date.now()};
        if (isLocal) {
            if (isEdit) setExpenses(p=>p.map(e=>e.id===record.id?record:e));
            else        setExpenses(p=>[{...record, id:Date.now().toString()},...p]);
            return;
        }
        const col = getExCol();
        if (isEdit) { const {id,...u}=record; await col.doc(id).update(u); } else await col.add(record);
    };

    const deleteExpense = async (id) => {
        if (isLocal) { setExpenses(p=>p.filter(e=>e.id!==id)); return; }
        await getExCol().doc(id).delete();
    };

    return {itinerary, expenses, isLocal, loading, saveItem, deleteItem, batchUpdate, saveExpense, deleteExpense};
};

// ─────────────────────────────────────────────────────────────────────────────
// MAP AREA (with parking + weather layers)
// ─────────────────────────────────────────────────────────────────────────────
const MapArea = memo(({itinerary, viewMode, activeDay, routeDays, focusTarget, onMetrics, isMobile, mapH, visible}) => {
    const mapEl    = useRef(null);
    const leaflet  = useRef(null);
    const markers  = useRef({});
    const lines    = useRef([]);
    const observer = useRef(null);
    const lastKey  = useRef('');
    // Layer refs
    const parkingMarkers = useRef([]);
    const weatherMarkers = useRef([]);

    const [layers, setLayers] = useState({parking:false, weather:false});
    const layersRef = useRef({parking:false, weather:false});
    const [parkingLoading, setParkingLoading]  = useState(false);
    const [weatherLoading, setWeatherLoading]  = useState(false);

    // Init map once
    useEffect(() => {
        if (leaflet.current || !mapEl.current) return;
        leaflet.current = L.map(mapEl.current, {zoomControl:true, scrollWheelZoom:true}).setView([26.4, 127.8], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(leaflet.current);
        observer.current = new ResizeObserver(() => leaflet.current?.invalidateSize());
        observer.current.observe(mapEl.current);
        return () => { observer.current?.disconnect(); leaflet.current?.remove(); leaflet.current = null; };
    }, []);

    useEffect(() => { setTimeout(() => leaflet.current?.invalidateSize(), 50); }, [mapH]);

    // 從其他分頁切回地圖頁時，強制重繪並 fitBounds 到當前 activeDay
    useEffect(() => {
        if (!visible || !leaflet.current) return;
        setTimeout(() => {
            leaflet.current.invalidateSize();
            lastKey.current = ''; // 清掉 cache，強制下次 effect 重跑
            // 直接 fitBounds 到當前顯示的天數
            const days = viewMode === 'route' ? routeDays : [activeDay];
            const pts = itinerary
                .filter(i => days.includes(i.day) && i.lat && i.lng)
                .map(i => [i.lat, i.lng]);
            if (pts.length > 0) {
                leaflet.current.fitBounds(L.latLngBounds(pts), {
                    padding: [50, 50], maxZoom: pts.length === 1 ? 14 : 13, animate: false
                });
            }
        }, 100);
    }, [visible, viewMode, activeDay, routeDays]);

    // ── PARKING LAYER ──
    const toggleParking = useCallback(async () => {
        if (!leaflet.current) return;
        const next = !layersRef.current.parking;
        layersRef.current = {...layersRef.current, parking: next};
        setLayers(p => ({...p, parking: next}));

        if (!next) {
            parkingMarkers.current.forEach(m => m.remove());
            parkingMarkers.current = [];
            return;
        }

        setParkingLoading(true);
        try {
            const bounds = leaflet.current.getBounds();
            const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
            const query = `[out:json][timeout:20];(node["amenity"="parking"](${bbox});way["amenity"="parking"](${bbox}););out center 60;`;
            const r = await fetch('https://overpass-api.de/api/interpreter', {
                method:'POST', body: 'data=' + encodeURIComponent(query),
                signal: AbortSignal.timeout(18000)
            });
            const d = await r.json();
            parkingMarkers.current.forEach(m => m.remove());
            parkingMarkers.current = [];

            (d.elements || []).forEach(el => {
                const lat = el.lat ?? el.center?.lat;
                const lng = el.lon ?? el.center?.lon;
                if (!lat || !lng) return;
                const icon = L.divIcon({
                    html:`<div style="background:#1e293b;color:white;border-radius:8px;padding:3px 6px;font-size:10px;font-weight:900;font-family:'Noto Sans TC',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;display:flex;align-items:center;gap:3px;"><span style="font-size:13px;">🅿</span></div>`,
                    className:'', iconAnchor:[20,16]
                });
                const fee = el.tags?.fee === 'yes' ? '收費' : el.tags?.fee === 'no' ? '免費' : '不明';
                const capacity = el.tags?.capacity ? `${el.tags.capacity} 位` : '';
                const m = L.marker([lat,lng], {icon}).addTo(leaflet.current).bindPopup(
                    `<div class="popup-content"><div style="font-size:13px;font-weight:800;color:#1e293b;margin-bottom:4px;">🅿 停車場</div><div style="font-size:12px;color:#64748b;">${fee}${capacity ? ' · '+capacity : ''}</div>${el.tags?.name?`<div style="font-size:11px;margin-top:4px;color:#94a3b8;">${el.tags.name}</div>`:''}</div>`,
                    {closeButton:false}
                );
                parkingMarkers.current.push(m);
            });
        } catch(e) {
            console.warn('Overpass API error', e);
        }
        setParkingLoading(false);
    }, []);

    // ── WEATHER LAYER ──
    const toggleWeather = useCallback(async () => {
        if (!leaflet.current) return;
        const next = !layersRef.current.weather;
        layersRef.current = {...layersRef.current, weather: next};
        setLayers(p => ({...p, weather: next}));

        if (!next) {
            weatherMarkers.current.forEach(m => m.remove());
            weatherMarkers.current = [];
            return;
        }

        setWeatherLoading(true);
        const newData = {};

        if (!OWM_KEY) {
            // Demo mode: show mock weather if no API key
            const mocks = [
                {name:'那霸',   temp:27, desc:'晴天', icon:'☀️', humidity:72, wind:4.2, lat:26.2124, lng:127.6809},
                {name:'沖繩市', temp:26, desc:'多雲', icon:'⛅', humidity:78, wind:3.8, lat:26.3344, lng:127.8056},
                {name:'名護',   temp:25, desc:'陣雨', icon:'🌦️', humidity:85, wind:5.1, lat:26.5912, lng:127.9776},
                {name:'糸満',   temp:27, desc:'晴天', icon:'☀️', humidity:70, wind:3.5, lat:26.1243, lng:127.6657},
                {name:'宜野灣', temp:26, desc:'多雲', icon:'⛅', humidity:75, wind:4.0, lat:26.2816, lng:127.7783},
            ];
            weatherMarkers.current.forEach(m => m.remove());
            weatherMarkers.current = [];
            mocks.forEach(w => {
                newData[w.name] = w;
                const icon = L.divIcon({
                    html:`<div style="background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:'Noto Sans TC',sans-serif;text-align:center;min-width:72px;">
                        <div style="font-size:18px;line-height:1;">${w.icon}</div>
                        <div style="font-size:13px;font-weight:900;color:#1e293b;margin-top:2px;">${w.temp}°C</div>
                        <div style="font-size:10px;font-weight:700;color:#64748b;">${w.name}</div>
                    </div>`,
                    className:'', iconAnchor:[36,60]
                });
                const m = L.marker([w.lat, w.lng], {icon}).addTo(leaflet.current).bindPopup(
                    `<div class="popup-content">
                        <div style="font-size:24px;text-align:center;margin-bottom:6px;">${w.icon}</div>
                        <div style="font-size:14px;font-weight:900;color:#1e293b;text-align:center;">${w.name}</div>
                        <div style="font-size:22px;font-weight:900;text-align:center;margin:6px 0;">${w.temp}°C</div>
                        <div style="font-size:12px;color:#64748b;text-align:center;">${w.desc}</div>
                        <div style="display:flex;justify-content:center;gap:12px;margin-top:8px;font-size:11px;font-weight:700;color:#94a3b8;">
                            <span>💧 ${w.humidity}%</span><span>💨 ${w.wind} m/s</span>
                        </div>
                    </div>`,
                    {closeButton:false}
                );
                weatherMarkers.current.push(m);
            });
            setWeatherLoading(false);
            return;
        }

        // Real OWM API
        weatherMarkers.current.forEach(m => m.remove());
        weatherMarkers.current = [];
        await Promise.all(OWM_CITIES.map(async city => {
            try {
                const r = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lng}&appid=${OWM_KEY}&units=metric&lang=zh_tw`);
                const d = await r.json();
                if (d.cod !== 200 && d.cod !== '200') return;
                const w = {
                    name: city.name,
                    temp: Math.round(d.main.temp),
                    desc: d.weather[0].description,
                    icon: `https://openweathermap.org/img/wn/${d.weather[0].icon}@2x.png`,
                    humidity: d.main.humidity,
                    wind: d.wind.speed.toFixed(1),
                    lat: city.lat, lng: city.lng
                };
                newData[city.name] = w;
                const icon = L.divIcon({
                    html:`<div style="background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:'Noto Sans TC',sans-serif;text-align:center;min-width:72px;">
                        <img src="${w.icon}" style="width:32px;height:32px;" />
                        <div style="font-size:13px;font-weight:900;color:#1e293b;margin-top:1px;">${w.temp}°C</div>
                        <div style="font-size:10px;font-weight:700;color:#64748b;">${w.name}</div>
                    </div>`,
                    className:'', iconAnchor:[36,70]
                });
                const m = L.marker([city.lat, city.lng], {icon}).addTo(leaflet.current).bindPopup(
                    `<div class="popup-content">
                        <div style="text-align:center;margin-bottom:4px;"><img src="${w.icon}" style="width:48px;height:48px;"/></div>
                        <div style="font-size:14px;font-weight:900;color:#1e293b;text-align:center;">${w.name}</div>
                        <div style="font-size:22px;font-weight:900;text-align:center;margin:4px 0;">${w.temp}°C</div>
                        <div style="font-size:12px;color:#64748b;text-align:center;">${w.desc}</div>
                        <div style="display:flex;justify-content:center;gap:12px;margin-top:8px;font-size:11px;font-weight:700;color:#94a3b8;">
                            <span>💧 ${w.humidity}%</span><span>💨 ${w.wind} m/s</span>
                        </div>
                    </div>`,
                    {closeButton:false}
                );
                weatherMarkers.current.push(m);
            } catch(e) { console.warn('OWM error', e); }
        }));
        setWeatherLoading(false);
    }, []);

    // ── ITINERARY MARKERS + ROUTES ──
    useEffect(() => {
        if (!leaflet.current) return;
        const key = JSON.stringify({viewMode, activeDay, routeDays, items:itinerary.map(i=>i.id+i.time+i.day)});
        if (key === lastKey.current) return;
        lastKey.current = key;
        let cancelled = false;

        Object.values(markers.current).forEach(m => m.remove());
        markers.current = {};
        lines.current.forEach(l => l.remove());
        lines.current = [];
        leaflet.current.invalidateSize();

        const days = viewMode === 'route' ? routeDays : [activeDay];
        const allLL = [];

        const run = async () => {
            const newMetrics = {};

            // ── Step 1: 同步畫 markers，立刻 fitBounds（不等 routing）──
            days.forEach(day => {
                const items = itinerary.filter(i=>i.day===day).sort((a,b)=>a.time.localeCompare(b.time));
                const valid = items.filter(i=>i.lat&&i.lng);
                if (!valid.length) return;
                valid.forEach((item, idx) => {
                    const sub = SUB_TYPES[item.subType] || SUB_TYPES.attraction;
                    const bw  = item.type==='backup' ? '#f59e0b' : '#fff';
                    const html = viewMode==='route'
                        ? `<div class="map-marker" style="background:${DAY_COLORS[day]};width:24px;height:24px;border-radius:50%;border:2.5px solid ${bw};box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900;font-family:'Noto Sans TC',sans-serif;">${idx+1}</div>`
                        : `<div class="map-marker" style="background:${sub.color};width:14px;height:14px;border-radius:50%;border:2.5px solid ${bw};box-shadow:0 2px 6px rgba(0,0,0,.25);"></div>`;
                    const icon = L.divIcon({html, className:'', iconSize:[24,24], iconAnchor:[12,12]});
                    const popup = `<div class="popup-content">
                        <span class="badge" style="background:${sub.bg};color:${sub.text};margin-bottom:8px;">${sub.label}</span>
                        <div style="font-size:14px;font-weight:800;color:#1e293b;line-height:1.3;">${item.location||item.content}</div>
                        ${item.location&&item.content!==item.location?`<div style="font-size:12px;color:#64748b;margin-top:4px;line-height:1.4;">${item.content}</div>`:''}
                        <a href="${item.url}" target="_blank" rel="noopener" class="popup-nav">導航 →</a>
                    </div>`;
                    const m = L.marker([item.lat,item.lng],{icon}).addTo(leaflet.current).bindPopup(popup,{closeButton:false,autoPanPadding:[30,30]});
                    markers.current[item.id] = m;
                    allLL.push([item.lat,item.lng]);
                });
            });

            // fitBounds 立刻執行，不等 routing
            if (allLL.length > 0) {
                leaflet.current.fitBounds(L.latLngBounds(allLL), {
                    padding: [50, 50],
                    maxZoom: allLL.length === 1 ? 14 : 13,
                    animate: true
                });
            }

            // ── Step 2: 非同步跑 routing，只更新 polyline，不再移動地圖 ──
            await Promise.all(days.map(async day => {
                const items = itinerary.filter(i=>i.day===day).sort((a,b)=>a.time.localeCompare(b.time));
                const valid = items.filter(i=>i.lat&&i.lng);
                if (valid.length < 2) return;
                try {
                    const coords = valid.map(i=>`${i.lng},${i.lat}`).join(';');
                    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`,{signal:AbortSignal.timeout(8000)});
                    const d = await r.json();
                    if (cancelled) return;
                    if (d.code==='Ok') {
                        const ll = d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
                        lines.current.push(L.polyline(ll,{color:DAY_COLORS[day],weight:4,opacity:.65,className:'route-animated'}).addTo(leaflet.current));
                        newMetrics[day] = d.routes[0].legs;
                    }
                } catch {
                    if (!cancelled) lines.current.push(L.polyline(valid.map(i=>[i.lat,i.lng]),{color:DAY_COLORS[day],weight:3,opacity:.45,dashArray:'8 6'}).addTo(leaflet.current));
                }
            }));
            if (cancelled) return;
            onMetrics(newMetrics);
        };
        run();
        return () => { cancelled=true; };
    }, [itinerary, viewMode, activeDay, routeDays]);

    useEffect(() => {
        if (!focusTarget || !leaflet.current) return;
        leaflet.current.setView([focusTarget.lat, focusTarget.lng], 15, {animate:true});
        setTimeout(() => markers.current[focusTarget.id]?.openPopup(), 300);
    }, [focusTarget]);

    return (
        <div style={{position:'relative', flex: (isMobile && mapH===100) ? '1' : isMobile ? 'none' : '1', height: (isMobile && mapH===100) ? '100%' : isMobile ? `${mapH}vh` : '100%'}}>
            <div ref={mapEl} style={{position:'absolute', inset:0}} />

            {/* Layer controls — top-right desktop, bottom-left mobile (above resize handle) */}
            <div className="map-layer-controls" style={{
                position:'absolute',
                ...(isMobile
                    ? {bottom:10, left:10, flexDirection:'row'}
                    : {top:12, right:12, flexDirection:'column'}
                ),
                zIndex:1000, display:'flex', gap:7
            }}>
                <button className={`layer-btn ${layers.parking?'on':''}`}
                    onClick={toggleParking}
                    style={{color: layers.parking?'#1e293b':'var(--text-muted)', borderColor: layers.parking?'#1e293b':'var(--border)'}}>
                    {parkingLoading ? <span className="spin" style={{fontSize:14}}>⟳</span> : <span style={{fontSize:14}}>🅿</span>}
                    停車場
                    <span style={{width:8,height:8,borderRadius:'50%',background:layers.parking?'#10b981':'#cbd5e1',flexShrink:0}} />
                </button>
                <button className={`layer-btn ${layers.weather?'on':''}`}
                    onClick={toggleWeather}
                    style={{color: layers.weather?'#0369a1':'var(--text-muted)', borderColor: layers.weather?'#0369a1':'var(--border)'}}>
                    {weatherLoading ? <span className="spin" style={{fontSize:14}}>⟳</span> : <span style={{fontSize:14}}>🌤</span>}
                    天氣
                    <span style={{width:8,height:8,borderRadius:'50%',background:layers.weather?'#10b981':'#cbd5e1',flexShrink:0}} />
                </button>
                {!OWM_KEY && layers.weather && (
                    <div style={{background:'#fffbeb',border:'1.5px solid #fcd34d',borderRadius:9,padding:'5px 8px',fontSize:10,fontWeight:700,color:'#92400e',maxWidth:130,lineHeight:1.4}}>
                        ⚠️ 示範模式<br/>請設定 OWM_KEY 使用真實天氣
                    </div>
                )}
            </div>

            {/* Legend */}
            <div style={{position:'absolute',bottom:14,right:14,zIndex:1000,background:'rgba(255,255,255,.95)',backdropFilter:'blur(8px)',borderRadius:12,padding:'10px 13px',boxShadow:'0 2px 12px rgba(0,0,0,.1)',border:'1px solid var(--border)'}}>
                <div style={{fontSize:10,fontWeight:800,color:'var(--text-muted)',marginBottom:7,textTransform:'uppercase',letterSpacing:'.05em'}}>圖例</div>
                {viewMode==='itinerary'
                    ? Object.values(SUB_TYPES).map(s=>(
                        <div key={s.label} style={{display:'flex',alignItems:'center',gap:7,marginBottom:3}}>
                            <div style={{width:10,height:10,borderRadius:'50%',background:s.color,border:'2px solid white',boxShadow:'0 1px 3px rgba(0,0,0,.15)',flexShrink:0}}/>
                            <span style={{fontSize:11,fontWeight:700,color:'var(--text-muted)'}}>{s.label}</span>
                        </div>))
                    : Object.entries(DAY_COLORS).filter(([d])=>routeDays.includes(+d)).map(([d,c])=>(
                        <div key={d} style={{display:'flex',alignItems:'center',gap:7,marginBottom:3}}>
                            <div style={{width:18,height:18,borderRadius:'50%',background:c,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontSize:9,fontWeight:900}}>{d}</div>
                            <span style={{fontSize:11,fontWeight:700,color:'var(--text-muted)'}}>Day {d}</span>
                        </div>))
                }
            </div>
        </div>
    );
}, (prev, next) =>
    prev.viewMode===next.viewMode && prev.activeDay===next.activeDay &&
    prev.mapH===next.mapH && prev.isMobile===next.isMobile &&
    prev.visible===next.visible &&
    JSON.stringify(prev.routeDays)===JSON.stringify(next.routeDays) &&
    JSON.stringify(prev.focusTarget)===JSON.stringify(next.focusTarget) &&
    prev.itinerary.length===next.itinerary.length &&
    prev.itinerary.every((it,i)=>it.id===next.itinerary[i]?.id&&it.time===next.itinerary[i]?.time&&it.day===next.itinerary[i]?.day)
);

// ─────────────────────────────────────────────────────────────────────────────
// TRIP CARD
// ─────────────────────────────────────────────────────────────────────────────
const TripCard = memo(({item, onEdit, onDelete, onShift, onFocus, onDragStart, onDrop, onTouchStart, onTouchMove, onTouchEnd, dragging}) => {
    const sub = SUB_TYPES[item.subType] || SUB_TYPES.attraction;
    return (
        <div className={`trip-card fade-in ${dragging?'touch-dragging':''}`}
            draggable onDragStart={onDragStart}

const ItinerarySidebar = ({itinerary, viewMode, activeDay, setActiveDay, routeDays, toggleRouteDay, onEdit, onDelete, onShift, onDragDrop, onFocus, metrics, showToast}) => {
    const [dragId, setDragId] = useState(null);
    const touchDragRef = useRef({active:false, startId:null, startY:0, currentY:0, clone:null, targetId:null});

    // Touch drag handlers
    const handleTouchStart = useCallback((e, itemId) => {
        // Only activate on long-press (400ms)
        const touch = e.touches[0];
        const timer = setTimeout(() => {
            touchDragRef.current = {active:true, startId:itemId, startY:touch.clientY, currentY:touch.clientY, clone:null, targetId:null};
            setDragId(itemId);
            if (navigator.vibrate) navigator.vibrate(30);
        }, 400);
        // Cancel if finger moves too early
        const cancel = () => { clearTimeout(timer); };
        e.target.addEventListener('touchmove', cancel, {once:true, passive:true});
        e.target.addEventListener('touchend', cancel, {once:true, passive:true});
    }, []);

    const handleTouchMove = useCallback((e, itemId) => {
        if (!touchDragRef.current.active) return;
        // Only preventDefault when actively dragging — otherwise browser scroll works
        if (e.cancelable) e.preventDefault();
        touchDragRef.current.currentY = e.touches[0].clientY;
        touchDragRef.current.targetId = itemId;
    }, []);

    const handleTouchEnd = useCallback((e) => {
        if (!touchDragRef.current.active) return;
        const {startId, targetId} = touchDragRef.current;
        touchDragRef.current = {active:false, startId:null, startY:0, currentY:0, clone:null, targetId:null};
        setDragId(null);
        if (startId && targetId && startId !== targetId) {
            onDragDrop(startId, targetId);
        }
    }, [onDragDrop]);
    const dayItems = useMemo(()=>itinerary.filter(i=>i.day===activeDay).sort((a,b)=>a.time.localeCompare(b.time)),[itinerary,activeDay]);

    const handleCopy = () => {
        const txt = dayItems.map(i=>`[${i.time}] ${i.location||i.content}${i.location&&i.content!==i.location?'\n  '+i.content:''}`).join('\n');
        const full = `🏝 沖繩自駕 Day ${activeDay}\n${txt}`;
        navigator.clipboard?.writeText(full).catch(()=>{
            const el=Object.assign(document.createElement('textarea'),{value:full});
            document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);
        });
        showToast('已複製 Day '+activeDay+' 行程');
    };
    const handleNav = () => {
        const items = dayItems.filter(i=>i.lat&&i.lng);
        if (items.length<2) return showToast('⚠️ 需至少兩個含座標地點才能導航');
        const origin=`${items[0].lat},${items[0].lng}`,dest=`${items.at(-1).lat},${items.at(-1).lng}`;
        const wps=items.slice(1,-1).map(i=>`${i.lat},${i.lng}`).join('|');
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving${wps?`&waypoints=${wps}`:''}`, '_blank');
    };

    return (
        <div style={{width:'100%',display:'flex',flexDirection:'column',background:'var(--surface2)'}}>
            {viewMode==='itinerary' ? (<>
                <div style={{padding:'10px 12px',borderBottom:'1px solid var(--border)',background:'white',display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',position:'sticky',top:0,zIndex:9}}>
                    {[1,2,3,4,5,6].map(d=><button key={d} className={`day-tab ${activeDay===d?'active':'inactive'}`} onClick={()=>setActiveDay(d)}>D{d}</button>)}
                    <div style={{flex:1,minWidth:6}}/>
                    <button className="btn-ghost" onClick={handleCopy} style={{flexShrink:0}}><Icon name="copy" size={12}/>複製</button>
                    <button className="btn-ghost" onClick={handleNav}  style={{flexShrink:0}}><Icon name="navigation" size={12} color="#0ea5e9"/>導航</button>
                </div>
                <div style={{padding:'10px 10px 24px',display:'flex',flexDirection:'column',gap:8}}>
                    {dayItems.length===0 ? (
                        <div style={{textAlign:'center',padding:'50px 20px',color:'var(--text-faint)'}}>
                            <Icon name="calendar-plus" size={36} color="var(--text-faint)"/>
                            <div style={{marginTop:12,fontSize:14,fontWeight:700}}>這天還沒有行程</div>
                            <div style={{fontSize:12,marginTop:4}}>點右上角 ＋ 新增</div>
                        </div>
                    ) : (<>
                        <div style={{textAlign:'center',fontSize:11,color:'var(--text-faint)',fontWeight:700,padding:'2px 0'}}>拖曳卡片可重新排序</div>
                        {dayItems.map(item=>(
                            <TripCard key={item.id} item={item} dragging={dragId===item.id}
                                onDragStart={()=>setDragId(item.id)}
                                onDrop={()=>{onDragDrop(dragId,item.id);setDragId(null);}}
                                onTouchStart={(e)=>handleTouchStart(e,item.id)}
                                onTouchMove={(e)=>handleTouchMove(e,item.id)}
                                onTouchEnd={handleTouchEnd}
                                onEdit={()=>onEdit(item)}
                                onDelete={()=>{if(confirm(`確定刪除「${item.content}」？`))onDelete(item.id);}}
                                onShift={()=>onShift(item.id)} onFocus={()=>onFocus(item)}/>
                        ))}
                    </>)}
                </div>
            </>) : (<>
                <div style={{padding:'12px 14px',borderBottom:'1px solid var(--border)',background:'white'}}>
                    <div style={{fontSize:13,fontWeight:800,color:'var(--text)',marginBottom:10,display:'flex',alignItems:'center',gap:7}}>
                        <Icon name="route" size={15} color="#0ea5e9"/>顯示路線
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7}}>
                        {[1,2,3,4,5,6].map(d=>(
                            <label key={d} style={{display:'flex',alignItems:'center',gap:7,padding:'7px 9px',borderRadius:9,border:`1.5px solid ${routeDays.includes(d)?DAY_COLORS[d]:'var(--border)'}`,background:routeDays.includes(d)?`${DAY_COLORS[d]}14`:'white',cursor:'pointer',transition:'all .15s',userSelect:'none'}}>
                                <input type="checkbox" checked={routeDays.includes(d)} onChange={()=>toggleRouteDay(d)} style={{width:13,height:13,accentColor:DAY_COLORS[d]}}/>
                                <div style={{width:9,height:9,borderRadius:'50%',background:DAY_COLORS[d],flexShrink:0}}/>
                                <span style={{fontSize:12,fontWeight:800,color:'var(--text)'}}>D{d}</span>
                            </label>
                        ))}
                    </div>
                </div>
                <div style={{padding:'12px 13px 24px',display:'flex',flexDirection:'column',gap:18}}>
                    {routeDays.map(d=>{
                        const items=itinerary.filter(i=>i.day===d).sort((a,b)=>a.time.localeCompare(b.time));
                        if(!items.length) return null;
                        return (
                            <div key={d}>
                                <div style={{fontSize:12,fontWeight:900,color:DAY_COLORS[d],display:'flex',alignItems:'center',gap:7,marginBottom:10,padding:'5px 9px',background:`${DAY_COLORS[d]}12`,borderRadius:8,border:`1.5px solid ${DAY_COLORS[d]}30`,width:'fit-content'}}>
                                    <div style={{width:7,height:7,borderRadius:'50%',background:DAY_COLORS[d]}}/>Day {d} 路線
                                </div>
                                {items.map((item,idx)=>(
                                    <div key={item.id}>
                                        <div className="route-stop" onClick={()=>onFocus(item)}>
                                            <div style={{width:26,height:26,borderRadius:'50%',background:DAY_COLORS[d],color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:900,flexShrink:0,marginTop:2,boxShadow:`0 2px 8px ${DAY_COLORS[d]}50`}}>{idx+1}</div>
                                            <div className="stop-card">
                                                <div style={{fontSize:11,fontWeight:700,color:'var(--text-faint)',marginBottom:2}}>{item.time}</div>
                                                <div style={{fontSize:13,fontWeight:800,color:'var(--text)',lineHeight:1.3}}>{item.location||item.content}</div>
                                            </div>
                                        </div>
                                        {idx<items.length-1&&(
                                            <div className="route-leg">
                                                {metrics[d]?.[idx] ? (
                                                    <div className="route-leg-pill"><Icon name="car" size={11}/>約 {Math.round(metrics[d][idx].duration/60)} 分 · {(metrics[d][idx].distance/1000).toFixed(1)} km</div>
                                                ) : <div style={{width:2,height:14,background:'var(--border)',borderRadius:99,marginLeft:12}}/>}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        );
                    })}
                </div>
            </>)}
        </div>
    );
};

];

const EXPENSE_DEFAULT = {description:'', amount:'', paidBy:MEMBERS[0], forWhom:[...MEMBERS], category:'food', day:1, note:''};

const ExpenseTab = ({expenses, saveExpense, deleteExpense, showToast}) => {
    const [showForm,   setShowForm]   = useState(false);
    const [editingEx,  setEditingEx]  = useState(null);
    const [form,       setForm]       = useState(EXPENSE_DEFAULT);
    const [activeTab,  setActiveTab]  = useState('list'); // 'list' | 'settle'

    const totalAmount = useMemo(()=>expenses.reduce((s,e)=>s+Number(e.amount),0),[expenses]);
    const settlements = useMemo(()=>settle(expenses, MEMBERS),[expenses]);

    const perMemberPaid = useMemo(()=>{
        const m={};MEMBERS.forEach(mb=>m[mb]=0);
        expenses.forEach(e=>{ m[e.paidBy]=(m[e.paidBy]||0)+Number(e.amount); });
        return m;
    },[expenses]);

    const perMemberShare = useMemo(()=>{
        const m={};MEMBERS.forEach(mb=>m[mb]=0);
        expenses.forEach(e=>{ const pp=Number(e.amount)/e.forWhom.length; e.forWhom.forEach(mb=>{ m[mb]=(m[mb]||0)+pp; }); });
        return m;
    },[expenses]);

    const openNew = () => { setForm({...EXPENSE_DEFAULT}); setEditingEx(null); setShowForm(true); };
    const openEdit = ex => { setForm({...ex}); setEditingEx(ex); setShowForm(true); };

    const handleSubmit = async e => {
        e.preventDefault();
        if (!form.description || !form.amount || form.forWhom.length===0) return showToast('⚠️ 請填寫完整資料');
        const record = {...form, amount:+form.amount, day:+form.day};
        if (editingEx) record.id = editingEx.id;
        await saveExpense(record, !!editingEx);
        setShowForm(false);
        showToast(editingEx?'費用已更新':'費用已記錄');
    };

    const toggleForWhom = m => {
        setForm(p=>({...p, forWhom: p.forWhom.includes(m) ? p.forWhom.filter(x=>x!==m) : [...p.forWhom,m]}));
    };

    const cat = k => EXPENSE_CATS.find(c=>c.key===k) || EXPENSE_CATS[0];

        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--surface2)'}}>

            <div style={{background:'white',borderBottom:'1px solid var(--border)',padding:'0 14px',display:'flex',alignItems:'center',gap:0}}>
                {[['list','明細'],['settle','結算']].map(([k,l])=>(
                    <button key={k} onClick={()=>setActiveTab(k)}
                        style={{padding:'12px 16px',border:'none',background:'transparent',cursor:'pointer',fontWeight:800,fontSize:13,color:activeTab===k?'var(--accent)':'var(--text-muted)',borderBottom:`2px solid ${activeTab===k?'var(--accent)':'transparent'}`,transition:'all .15s'}}>
                        {l}
                    </button>
                ))}
                <div style={{flex:1}}/>
                <button className="btn-primary" onClick={openNew} style={{padding:'6px 14px',fontSize:13,marginLeft:8}}>
                    <Icon name="plus" size={14} color="white"/>記帳
                </button>
            </div>

            {activeTab==='list' ? (
                <div className="scroll" style={{flex:1,minHeight:0,overflowY:'auto',padding:'12px 12px 24px',display:'flex',flexDirection:'column',gap:8}}>
                    {/* Summary bar */}
                    <div style={{background:'white',borderRadius:14,border:'1.5px solid var(--border)',padding:'14px 16px',display:'flex',gap:12,alignItems:'center',marginBottom:4}}>
                        <div>
                            <div style={{fontSize:11,fontWeight:800,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.06em'}}>總支出</div>
                            <div style={{fontSize:22,fontWeight:900,color:'var(--text)',marginTop:2}}>{fmt(totalAmount)}</div>
                        </div>
                        <div style={{flex:1}}/>
                        <div style={{textAlign:'right'}}>
                            <div style={{fontSize:11,fontWeight:800,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.06em'}}>每人均攤</div>
                            <div style={{fontSize:16,fontWeight:900,color:'#0369a1',marginTop:2}}>{fmt(totalAmount/MEMBERS.length)}</div>
                        </div>
                    </div>

                    {expenses.length===0 ? (
                        <div style={{textAlign:'center',padding:'40px 20px',color:'var(--text-faint)'}}>
                            <span style={{fontSize:40}}>💰</span>
                            <div style={{marginTop:12,fontSize:14,fontWeight:700}}>還沒有費用記錄</div>
                            <div style={{fontSize:12,marginTop:4}}>點右上角「記帳」開始記錄</div>

const FORM_DEFAULT = {day:1,time:'09:00',content:'',location:'',url:'',lat:26.2124,lng:127.6809,member:MEMBERS[0],type:'main',subType:'attraction'};

const ItemModal = ({open, editing, onClose, onSave, activeDay}) => {
    const [form,    setForm]    = useState(FORM_DEFAULT);
    const [urlWarn, setUrlWarn] = useState('');

    useEffect(()=>{
        if(!open) return;
        setForm(editing?{...editing}:{...FORM_DEFAULT,day:activeDay});
        setUrlWarn('');
    },[open,editing,activeDay]);

    if (!open) return null;
    const set=(k,v)=>setForm(p=>({...p,[k]:v}));

    const handleUrlBlur = e => {
        const url = e.target.value;
        if (!url) { setUrlWarn(''); return; }
        const mAt=url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/), m3d=url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
        if (mAt)      { setForm(p=>({...p,lat:+mAt[1],lng:+mAt[2]})); setUrlWarn(''); }
        else if (m3d) { setForm(p=>({...p,lat:+m3d[1],lng:+m3d[2]})); setUrlWarn(''); }
        else if (url.includes('goo.gl')||url.includes('maps.app')) setUrlWarn('短網址無法自動解析，請貼完整網址或手動填座標。');
        else setUrlWarn('無法從此網址取得座標，請手動填寫。');
    };

    const handleSubmit = e => {
        e.preventDefault();
        const data={...form,day:+form.day,lat:+form.lat||26.2124,lng:+form.lng||127.6809};
        if(!editing) delete data.id;
        onSave(data,!!editing);
        onClose();
    };

    return (
        <div className="modal-bg" onClick={onClose} style={{position:'fixed',inset:0,zIndex:4000,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(15,23,42,.72)',backdropFilter:'blur(6px)'}}>
            <div className="modal-panel" onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:22,width:'100%',maxWidth:440,maxHeight:'90vh',display:'flex',flexDirection:'column',overflow:'hidden',boxShadow:'0 32px 64px rgba(0,0,0,.2)'}}>
                <div style={{padding:'15px 20px',background:'var(--text)',color:'white',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
                    <div style={{fontWeight:900,fontSize:16}}>{editing?'✏️ 編輯行程':'＋ 新增行程'}</div>
                    <button onClick={onClose} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,width:28,height:28,cursor:'pointer',color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <Icon name="x" size={14} color="white"/>
                    </button>
                </div>
                <form onSubmit={handleSubmit} className="scroll" style={{flex:1,overflowY:'auto',padding:'18px 18px 80px',display:'flex',flexDirection:'column',gap:16}}>
                    <div style={{display:'flex',gap:12}}>
                        <div style={{flex:1}}>
                            <label className="form-label">Day</label>
                            <select value={form.day} onChange={e=>set('day',e.target.value)} className="form-input">
                                {[1,2,3,4,5,6].map(d=><option key={d} value={d}>Day {d}</option>)}
                            </select>
                        </div>
                        <div style={{flex:1}}>
                            <label className="form-label">時間</label>
                            <div style={{display:'flex',alignItems:'center',gap:5}}>
                                <select value={form.time.split(':')[0]} onChange={e=>set('time',`${e.target.value}:${form.time.split(':')[1]}`)} className="form-input" style={{flex:1,textAlign:'center',padding:'10px 2px'}}>
                                    {Array.from({length:24},(_,i)=>i.toString().padStart(2,'0')).map(h=><option key={h} value={h}>{h}</option>)}
                                </select>
                                <span style={{fontWeight:900,color:'var(--text-muted)',flexShrink:0}}>:</span>
                                <select value={form.time.split(':')[1]} onChange={e=>set('time',`${form.time.split(':')[0]}:${e.target.value}`)} className="form-input" style={{flex:1,textAlign:'center',padding:'10px 2px'}}>
                                    {['00','05','10','15','20','25','30','35','40','45','50','55'].map(m=><option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label className="form-label">性質</label>
                        <div style={{display:'flex',gap:8}}>
                            {[['main','主要行程'],['backup','備選景點']].map(([v,l])=>(
                                <button type="button" key={v} onClick={()=>set('type',v)} style={{flex:1,padding:'8px 0',borderRadius:9,border:`1.5px solid ${form.type===v?'var(--text)':'var(--border)'}`,background:form.type===v?'var(--text)':'white',color:form.type===v?'white':'var(--text-muted)',fontWeight:800,fontSize:13,cursor:'pointer',transition:'all .15s'}}>{l}</button>
                            ))}

                    </div>
                    <div>
                        <label className="form-label">類別</label>
                        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:7}}>
                            {Object.entries(SUB_TYPES).map(([k,s])=>(
                                <button type="button" key={k} className="subtype-btn" onClick={()=>set('subType',k)}
                                    style={{color:form.subType===k?s.text:'var(--text-muted)',background:form.subType===k?s.bg:'white',borderColor:form.subType===k?s.color:'var(--border)'}}>
                                    <Icon name={s.icon} size={17} color={form.subType===k?s.text:undefined}/>{s.label}

                    </div>
                    <div>
                        <label className="form-label">負責人</label>
                        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                            {MEMBERS.map(m=><button type="button" key={m} className={`member-pill ${form.member===m?'selected':''}`} onClick={()=>set('member',m)}>{m}</button>)}
                        </div>
                    </div>
                    <div>
                        <label className="form-label">地點名稱</label>
                        <input className="form-input" value={form.location} onChange={e=>set('location',e.target.value)} placeholder="例：美麗海水族館"/>
                    </div>
                    <div>
                        <label className="form-label">行程描述 <span style={{color:'var(--accent)'}}>*</span></label>
                        <input className="form-input" required value={form.content} onChange={e=>set('content',e.target.value)} placeholder="簡短描述這個行程"/>
                    </div>
                    <div style={{background:'var(--bg)',borderRadius:13,padding:'13px 15px',border:'1px solid var(--border)'}}>
                        <label className="form-label" style={{color:'var(--accent)'}}>Google Maps 連結</label>
                        <input className="form-input" type="url" value={form.url} onChange={e=>{set('url',e.target.value);setUrlWarn('');}} onBlur={handleUrlBlur} placeholder="貼完整網址可自動取得座標…" style={{marginBottom:urlWarn?8:10,background:'white'}}/>
                        {urlWarn&&<div style={{fontSize:12,color:'#ef4444',fontWeight:700,marginBottom:8,display:'flex',alignItems:'center',gap:5}}><Icon name="alert-triangle" size={13} color="#ef4444"/>{urlWarn}</div>}

                            <input className="form-input" type="number" step="any" value={form.lng} onChange={e=>set('lng',e.target.value)} placeholder="經度 Lng" style={{fontFamily:"'DM Mono',monospace",fontSize:13,background:'white'}}/>

// APP
// ─────────────────────────────────────────────────────────────────────────────
const App = () => {
    const {itinerary, expenses, isLocal, loading, saveItem, deleteItem, batchUpdate, saveExpense, deleteExpense} = useFirebase();
    const [mainTab,   setMainTab]   = useState('map');    // 'map' | 'itinerary' | 'expense'
    const [viewMode,  setViewMode]  = useState('itinerary');
    const [mobileViewMode, setMobileViewMode] = useState('itinerary'); // 手機行程頁獨立 state
    const [activeDay, setActiveDay] = useState(1);
    const [routeDays, setRouteDays] = useState([1,2,3,4,5,6]);
    const [isMobile,  setIsMobile]  = useState(window.innerWidth < 768);
    const [mapH,      setMapH]      = useState(42);
    const [toast,     setToast]     = useState({msg:'',show:false});
    const [focus,     setFocus]     = useState(null);
    const [metrics,   setMetrics]   = useState({});
    const [modalOpen, setModalOpen] = useState(false);
    const [editing,   setEditing]   = useState(null);

    useEffect(()=>{
        const fn=()=>setIsMobile(window.innerWidth<768);
        window.addEventListener('resize',fn);
        return ()=>window.removeEventListener('resize',fn);
    },[]);

    const showToast = useCallback(msg=>{
        setToast({msg,show:true});
        const t=setTimeout(()=>setToast({msg:'',show:false}),3000);
        return ()=>clearTimeout(t);
    },[]);

    const handleDragDrop = useCallback(async(dragId,targetId)=>{
        if(dragId===targetId) return;
        const a=itinerary.find(i=>i.id===dragId), b=itinerary.find(i=>i.id===targetId);
        if(!a||!b) return;
        await batchUpdate([{id:dragId,time:b.time},{id:targetId,time:a.time}]);
    },[itinerary,batchUpdate]);

    const handleShift = useCallback(async(startId)=>{
        const dayItems=itinerary.filter(i=>i.day===activeDay).sort((a,b)=>a.time.localeCompare(b.time));
        const startIdx=dayItems.findIndex(i=>i.id===startId);
        if(startIdx===-1) return;
        const updates=dayItems.slice(startIdx).map(item=>{
            const [h,m]=item.time.split(':').map(Number);
            const d=new Date(2000,0,1,h,m+30);
            return {id:item.id,time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
        });
        await batchUpdate(updates);
        showToast('已順延此行程及後續 30 分鐘');
    },[itinerary,activeDay,batchUpdate,showToast]);

    const handleSave = useCallback(async(data,isEdit)=>{
        await saveItem(data,isEdit);
        showToast(isEdit?'行程已更新':'已新增行程');
    },[saveItem,showToast]);

    const handleResizeStart = useCallback(e=>{
        // Must be non-passive to call preventDefault on touchmove
        const startY = e.touches?.[0]?.clientY ?? e.clientY;
        const startH = mapH;
        const vh = window.innerHeight / 100;

        const move = me => {
            if (me.cancelable) me.preventDefault(); // stop page scroll while dragging
            const y = me.touches?.[0]?.clientY ?? me.clientY;
            const newH = Math.max(15, Math.min(70, startH + (y - startY) / vh));
            setMapH(newH);
        };
        const up = () => {
            window.removeEventListener('mousemove', move);
            window.removeEventListener('mouseup', up);
            window.removeEventListener('touchmove', move);
            window.removeEventListener('touchend', up);
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
        // {passive:false} is critical — allows preventDefault inside touchmove
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', up);
    },[mapH]);

    const snapMapH = useCallback((vh) => setMapH(vh), []);

    if (loading) return (
        <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,background:'var(--bg)'}}>
            <div style={{width:44,height:44,border:'4px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
            <div style={{fontSize:14,fontWeight:700,color:'var(--text-muted)'}}>載入行程資料…</div>
        </div>
    );

    const totalExpense = expenses.reduce((s,e)=>s+Number(e.amount),0);

    return (
        <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
            <Toast msg={toast.msg} show={toast.show}/>

            {/* ── HEADER ── */}
            <header style={{background:'var(--text)',color:'white',padding:'0 16px',height:'var(--header-h)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexShrink:0,zIndex:20}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div className="header-logo" style={{background:'#3b82f6',width:32,height:32,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <Icon name="map" size={16} color="white"/>
                    </div>
                    <div>
                        <div className="header-title" style={{fontWeight:900,fontSize:15,letterSpacing:'-.02em'}}>沖繩旅遊地圖</div>
                        <div className="header-subtitle" style={{fontSize:10,fontWeight:700,color:isLocal?'#fbbf24':'#4ade80',letterSpacing:'.03em'}}>{isLocal?'● 離線模式':'● 雲端同步'}</div>
                    </div>
                </div>

                {/* Desktop tab switch */}
                {!isMobile && (
                    <div style={{display:'flex',gap:2,background:'rgba(255,255,255,.12)',borderRadius:11,padding:3}}>
                        {[['map','地圖行程','map'],['expense','費用結算','wallet']].map(([k,l,icon])=>(
                            <button key={k} className={`view-btn ${mainTab===k?'active':''}`} onClick={()=>setMainTab(k)}>
                                <Icon name={icon} size={13}/>{l}
                                {k==='expense'&&totalExpense>0&&<span style={{background:mainTab==='expense'?'var(--accent)':'rgba(255,255,255,.3)',color:'white',borderRadius:99,padding:'1px 6px',fontSize:10,fontWeight:900}}>{fmt(totalExpense)}</span>}
                            </button>
                        ))}
                    </div>
                )}

                <div style={{display:'flex',gap:8,alignItems:'center',minWidth:isMobile?'auto':120,justifyContent:'flex-end'}}>
                    {!isMobile && (
                        <div className="view-toggle" style={{visibility: mainTab==='map' ? 'visible' : 'hidden'}}>
                            <button className={`view-btn ${viewMode==='itinerary'?'active':''}`} onClick={()=>setViewMode('itinerary')}><Icon name="list" size={13}/>單日</button>
                            <button className={`view-btn ${viewMode==='route'?'active':''}`} onClick={()=>setViewMode('route')}><Icon name="route" size={13}/>路線</button>
                        </div>
                    )}
                    {(mainTab==='map' || mainTab==='itinerary') && (
                        <button onClick={()=>{setEditing(null);setModalOpen(true);}} className="btn-primary" style={{padding:'7px 14px',fontSize:13}}>
                            <Icon name="plus" size={15} color="white"/>新增
                        </button>
                    )}
                </div>
            </header>

            {/* ── BODY ── */}
            {isMobile ? (
                /* ── MOBILE: 3 獨立全螢幕分頁 ── */
                <>
                    {/* 地圖頁 */}
                    <div style={{flex:1,display:mainTab==='map'?'flex':'none',flexDirection:'column',overflow:'hidden',minHeight:0,isolation:'isolate',paddingBottom:'calc(var(--nav-h) + var(--safe-bottom))'}}>
                        <MapArea itinerary={itinerary} viewMode={mobileViewMode} activeDay={activeDay} routeDays={routeDays} focusTarget={focus} onMetrics={setMetrics} isMobile={true} mapH={100} visible={mainTab==='map'}/>
                    </div>

                    {/* 行程頁 — 整頁滾動，無高度限制 */}
                    <div style={{
                        display: mainTab==='itinerary' ? 'block' : 'none',
                        overflowY: 'auto',
                        WebkitOverflowScrolling: 'touch',
                        touchAction: 'pan-y',
                        flex: 1,
                        background: 'var(--surface2)',
                        paddingBottom: 'calc(var(--nav-h) + var(--safe-bottom) + 16px)'
                    }}>
                        {/* 單日 / 路線 切換 */}
                        <div style={{background:'white',borderBottom:'1px solid var(--border)',padding:'8px 12px',display:'flex',gap:6,alignItems:'center',position:'sticky',top:0,zIndex:10}}>
                            <div className="view-toggle" style={{background:'var(--bg)'}}>
                                <button className={`view-btn ${mobileViewMode==='itinerary'?'active':''}`}
                                    onClick={()=>setMobileViewMode('itinerary')}
                                    style={{color:mobileViewMode==='itinerary'?'var(--text)':'var(--text-muted)'}}>
                                    <Icon name="list" size={13}/>單日
                                </button>
                                <button className={`view-btn ${mobileViewMode==='route'?'active':''}`}
                                    onClick={()=>setMobileViewMode('route')}
                                    style={{color:mobileViewMode==='route'?'var(--text)':'var(--text-muted)'}}>
                                    <Icon name="route" size={13}/>路線
                                </button>
                            </div>
                        </div>
                        <ItinerarySidebar itinerary={itinerary} viewMode={mobileViewMode} activeDay={activeDay} setActiveDay={setActiveDay} routeDays={routeDays} toggleRouteDay={d=>setRouteDays(p=>p.includes(d)?p.filter(x=>x!==d):[...p,d].sort())} onEdit={item=>{setEditing(item);setModalOpen(true);}} onDelete={deleteItem} onShift={handleShift} onDragDrop={handleDragDrop} onFocus={item=>{setFocus(item);setMainTab('map');}} metrics={metrics} showToast={showToast}/>
                    </div>

                    {/* 費用頁 */}
                    <div style={{flex:1,minHeight:0,display:mainTab==='expense'?'flex':'none',flexDirection:'column',overflow:'hidden',background:'var(--surface2)'}}>
                        <ExpenseTab expenses={expenses} saveExpense={saveExpense} deleteExpense={deleteExpense} showToast={showToast}/>
                    </div>
                </>
            ) : (
                /* ── DESKTOP LAYOUT ── */
                mainTab === 'map' ? (
                    <div style={{flex:1,display:'flex',flexDirection:'row',overflow:'hidden',minHeight:0}}>
                        <div style={{width:'var(--sidebar-w)',flexShrink:0,display:'flex',flexDirection:'column',borderRight:'1px solid var(--border)',overflowY:'auto',overflowX:'hidden'}}>
                            <ItinerarySidebar itinerary={itinerary} viewMode={viewMode} activeDay={activeDay} setActiveDay={setActiveDay} routeDays={routeDays} toggleRouteDay={d=>setRouteDays(p=>p.includes(d)?p.filter(x=>x!==d):[...p,d].sort())} onEdit={item=>{setEditing(item);setModalOpen(true);}} onDelete={deleteItem} onShift={handleShift} onDragDrop={handleDragDrop} onFocus={setFocus} metrics={metrics} showToast={showToast}/>
                        </div>
                        <MapArea itinerary={itinerary} viewMode={viewMode} activeDay={activeDay} routeDays={routeDays} focusTarget={focus} onMetrics={setMetrics} isMobile={false} mapH={mapH} visible={true}/>
                    </div>
                ) : (
                    <div style={{flex:1,display:'flex',flexDirection:'row',overflow:'hidden',minHeight:0}}>
                        <div style={{width:'var(--sidebar-w)',flexShrink:0,borderRight:'1px solid var(--border)',display:'flex',flexDirection:'column',overflowY:'auto',overflowX:'hidden'}}>
                            <ExpenseTab expenses={expenses} saveExpense={saveExpense} deleteExpense={deleteExpense} showToast={showToast}/>
                        </div>
                        <MapArea itinerary={itinerary} viewMode={viewMode} activeDay={activeDay} routeDays={routeDays} focusTarget={focus} onMetrics={setMetrics} isMobile={false} mapH={mapH} visible={true}/>
                    </div>
                )
            )}

            {/* ── MOBILE BOTTOM NAV ── */}
            <nav className="bottom-nav">
                <button className={`nav-tab ${mainTab==='map'?'active':''}`} onClick={()=>setMainTab('map')}>
                    <Icon name="map" size={20} color={mainTab==='map'?'var(--accent)':'var(--text-faint)'}/>
                    地圖
                </button>
                <button className={`nav-tab ${mainTab==='itinerary'?'active':''}`} onClick={()=>setMainTab('itinerary')}>
                    <Icon name="calendar" size={20} color={mainTab==='itinerary'?'var(--accent)':'var(--text-faint)'}/>
                    行程
                </button>
                <button className={`nav-tab ${mainTab==='expense'?'active':''}`} onClick={()=>setMainTab('expense')} style={{position:'relative'}}>
                    <Icon name="wallet" size={20} color={mainTab==='expense'?'var(--accent)':'var(--text-faint)'}/>
                    費用
                    {totalExpense>0&&<span style={{position:'absolute',top:4,right:8,background:'var(--accent)',color:'white',borderRadius:99,padding:'1px 5px',fontSize:9,fontWeight:900,lineHeight:'14px'}}>{expenses.length}</span>}
                </button>
            </nav>

            {/* Mobile FAB */}
            {(mainTab==='map'||mainTab==='itinerary')&&<button className="fab" onClick={()=>{setEditing(null);setModalOpen(true);}}><Icon name="plus" size={22} color="white"/></button>}

            <ItemModal open={modalOpen} editing={editing} onClose={()=>{setModalOpen(false);setEditing(null);}} onSave={handleSave} activeDay={activeDay}/>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
// PWA Service Worker
if ('serviceWorker' in navigator) {
    const swCode = `
const CACHE = 'okinawa-v1';
const PRECACHE = [
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
    'https://unpkg.com/react@18/umd/react.production.min.js',
    'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
    'https://unpkg.com/@babel/standalone/babel.min.js',
    'https://unpkg.com/lucide@latest',
];
self.addEventListener('install', e => {
    e.waitUntil(caches.open(CACHE).then(c => c.addAll(PRECACHE).catch(()=>{})));
    self.skipWaiting();
});
self.addEventListener('activate', e => {
    e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
    self.clients.claim();
});
self.addEventListener('fetch', e => {
    // Cache CDN assets; network-first for Firebase/API
    const url = new URL(e.request.url);
    const isCDN = url.hostname.includes('unpkg.com') || url.hostname.includes('googleapis.com') || url.hostname.includes('cdnjs');
    if (isCDN) {
        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).then(res => {
            const clone = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
            return res;
        }).catch(() => r)));
    }
});
`;
    const blob = new Blob([swCode], {type:'application/javascript'});
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// Install prompt for Android
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    // Show a subtle install hint after 3s if not already installed
    setTimeout(() => {
        if (deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
            const banner = document.createElement('div');
            banner.id = 'install-banner';
            banner.style.cssText = 'position:fixed;bottom:calc(62px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:9998;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);white-space:nowrap;animation:fadeIn .3s ease;';
            banner.innerHTML = '📲 加入主畫面離線使用 <button onclick="installApp()" style="background:white;color:#1e293b;border:none;border-radius:8px;padding:5px 12px;font-weight:800;font-size:12px;cursor:pointer;">安裝</button><button onclick="document.getElementById('install-banner').remove()" style="background:transparent;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:16px;padding:0 4px;">×</button>';
            document.body.appendChild(banner);
            setTimeout(() => banner?.remove(), 12000);
        }
    }, 3000);
});
window.installApp = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner')?.remove();
};
</script>
</body>
