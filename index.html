<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>沖繩 6 日自駕之旅 - 互動行程與路線地圖</title>
    <!-- 引入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* 鎖定全螢幕，採用 App 式佈局 */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f8fafc; }
        #root { height: 100%; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 自訂捲軸 */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 地圖樣式覆寫 */
        .leaflet-div-icon { background: transparent; border: none; }
        .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .leaflet-popup-content { margin: 8px; }
        
        /* 地圖標記懸停動畫 */
        .marker-anim { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .marker-anim:hover { transform: scale(1.2); z-index: 1000 !important; }

        /* 導航路線動畫 */
        .route-line { stroke-dasharray: 10, 10; animation: dash 20s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -1000; } }

        /* 防止行動端點擊閃爍與縮放 */
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        input, select, textarea { font-size: 16px !important; }
        
        .route-checkbox:checked + div { border-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const getFirebaseConfig = () => {
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    return JSON.parse(__firebase_config);
                }
            } catch (e) {
                console.warn("未偵測到環境變數。");
            }
            return null;
        };

        const firebaseConfig = getFirebaseConfig();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'okinawa-trip-2025';
        const MEMBERS = ["志展", "盧志", "大維", "禹康", "懿軒"];

        const SUB_TYPES = {
            attraction: { label: '景點', color: '#3b82f6', icon: 'camera', badgeBg: 'bg-blue-100', badgeText: 'text-blue-700', border: 'border-blue-500' },
            food: { label: '食物', color: '#ef4444', icon: 'utensils', badgeBg: 'bg-red-100', badgeText: 'text-red-700', border: 'border-red-500' },
            shopping: { label: '購物', color: '#a855f7', icon: 'shopping-bag', badgeBg: 'bg-purple-100', badgeText: 'text-purple-700', border: 'border-purple-500' }
        };
        
        const DAY_COLORS = {
            1: '#3b82f6', 2: '#10b981', 3: '#ef4444', 
            4: '#f59e0b', 5: '#8b5cf6', 6: '#ec4899'
        };

        const INITIAL_ITINERARY = [
            { id: 'seed_1', day: 1, time: '19:45', content: '全員抵達那霸機場、飯店 Check-in', location: '那霸機場', url: 'https://www.google.com/maps/search/?api=1&query=那霸機場', lat: 26.2064, lng: 127.6465, member: '志展', type: 'main', subType: 'attraction' },
            { id: 'seed_2', day: 1, time: '21:30', content: '晚餐：Torijin Naha (鳥神串燒)', location: 'Torijin Naha', url: 'https://www.google.com/maps/search/?api=1&query=那覇+焼き鳥+鳥神', lat: 26.2155, lng: 127.6792, member: '盧志', type: 'main', subType: 'food' },
            { id: 'seed_3', day: 2, time: '09:00', content: '市區取車 → 波上宮', location: '波上宮', url: 'https://www.google.com/maps/search/?api=1&query=波上宮', lat: 26.2207, lng: 127.6711, member: '大維', type: 'main', subType: 'attraction' },
            { id: 'seed_4', day: 2, time: '11:30', content: '午餐：漁師食堂 (海鮮)', location: '漁師食堂', url: 'https://www.google.com/maps/search/?api=1&query=漁師食堂+大木海產物', lat: 26.3456, lng: 127.7890, member: '禹康', type: 'main', subType: 'food' },
            { id: 'seed_5', day: 2, time: '14:00', content: '購物：PARCO CITY', location: 'PARCO CITY', url: 'https://www.google.com/maps/search/?api=1&query=浦添西海岸+PARCO+CITY', lat: 26.2625, lng: 127.6975, member: '懿軒', type: 'main', subType: 'shopping' },
            { id: 'seed_6', day: 3, time: '10:00', content: '重點：美麗海水族館', location: '美麗海水族館', url: 'https://www.google.com/maps/search/?api=1&query=沖縄美ら海水族館', lat: 26.6944, lng: 127.8779, member: '大維', type: 'main', subType: 'attraction' },
            { id: 'seed_7', day: 4, time: '12:00', content: '散策：美國村深度漫遊', location: '美國村', url: 'https://www.google.com/maps/search/?api=1&query=北谷美浜アメリカンビレッジ', lat: 26.3163, lng: 127.7576, member: '盧志', type: 'main', subType: 'attraction' },
            { id: 'seed_8', day: 5, time: '10:30', content: '景點：沖繩世界 (玉泉洞)', location: '沖繩世界', url: 'https://www.google.com/maps/search/?api=1&query=おきなわワールド', lat: 26.1397, lng: 127.7503, member: '志展', type: 'main', subType: 'attraction' },
            { id: 'seed_9', day: 6, time: '09:30', content: '景點：首里城參觀', location: '首里城', url: 'https://www.google.com/maps/search/?api=1&query=首里城', lat: 26.2170, lng: 127.7194, member: '懿軒', type: 'main', subType: 'attraction' }
        ];

        const Icon = ({ name, className = "w-4 h-4" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [itinerary, setItinerary] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [isLocalMode, setIsLocalMode] = useState(!firebaseConfig);
            
            const [viewMode, setViewMode] = useState('itinerary'); 
            const [activeDay, setActiveDay] = useState(1);
            const [routeDays, setRouteDays] = useState([1, 2, 3, 4, 5, 6]);
            
            const [formData, setFormData] = useState({
                day: 1, time: '', content: '', location: '', url: '', lat: 26.2124, lng: 127.6809, member: MEMBERS[0], type: 'main', subType: 'attraction'
            });

            const mapRef = useRef(null);
            const markersRef = useRef([]);
            const polylinesRef = useRef([]);
            const leafletMap = useRef(null);

            useEffect(() => {
                if (!firebaseConfig) {
                    setLoading(false);
                    return;
                }
                const setupFirebase = async () => {
                    try {
                        const app = firebase.apps.length > 0 ? firebase.app() : firebase.initializeApp(firebaseConfig);
                        const auth = firebase.auth();
                        const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                            if (u) {
                                setUser(u);
                            } else {
                                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                    auth.signInWithCustomToken(__initial_auth_token).catch(() => auth.signInAnonymously());
                                } else {
                                    auth.signInAnonymously();
                                }
                            }
                        });
                        return () => unsubscribeAuth();
                    } catch (err) {
                        console.error("Firebase Setup Error:", err);
                        setIsLocalMode(true);
                        setLoading(false);
                    }
                };
                setupFirebase();
            }, []);

            useEffect(() => {
                if (isLocalMode) {
                    setItinerary(INITIAL_ITINERARY);
                    setLoading(false);
                    return;
                }
                if (!user) return;
                const db = firebase.firestore();
                const itineraryCol = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerary');
                const unsubscribeData = itineraryCol.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if (data.length > 0) {
                        const sorted = data.sort((a, b) => {
                            if (a.day !== b.day) return a.day - b.day;
                            return a.time.localeCompare(b.time);
                        });
                        setItinerary(sorted);
                    } else {
                        INITIAL_ITINERARY.forEach(item => itineraryCol.add(item));
                    }
                    setLoading(false);
                }, (err) => {
                    console.error("Firestore Error:", err);
                    setLoading(false);
                });
                return () => unsubscribeData();
            }, [user, isLocalMode]);

            useEffect(() => {
                if (!leafletMap.current && mapRef.current) {
                    leafletMap.current = L.map(mapRef.current, {
                        zoomControl: true,
                        scrollWheelZoom: true
                    }).setView([26.4, 127.8], 9);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(leafletMap.current);
                }

                const updateMapDisplay = () => {
                    if (leafletMap.current) {
                        leafletMap.current.invalidateSize();
                        
                        markersRef.current.forEach(m => m.remove());
                        markersRef.current = [];
                        polylinesRef.current.forEach(p => p.remove());
                        polylinesRef.current = [];

                        const daysToRender = viewMode === 'route' ? routeDays : [activeDay];
                        
                        daysToRender.forEach(day => {
                            const dayItems = itinerary.filter(i => i.day === day).sort((a,b) => a.time.localeCompare(b.time));
                            const validItems = dayItems.filter(i => i.lat && i.lng);
                            const latlngs = validItems.map(i => [i.lat, i.lng]);

                            if (latlngs.length > 1) {
                                const routeColor = viewMode === 'route' ? DAY_COLORS[day] : '#94a3b8';
                                const routeLine = L.polyline(latlngs, {
                                    color: routeColor,
                                    weight: 4,
                                    opacity: 0.8,
                                    className: 'route-line',
                                    lineJoin: 'round'
                                }).addTo(leafletMap.current);
                                polylinesRef.current.push(routeLine);
                            }

                            validItems.forEach((item, index) => {
                                const sub = SUB_TYPES[item.subType] || SUB_TYPES.attraction;
                                const borderColor = item.type === 'backup' ? '#f59e0b' : '#ffffff';
                                
                                let html = '';
                                if (viewMode === 'route') {
                                    const bgColor = DAY_COLORS[day];
                                    html = `<div class="marker-anim flex items-center justify-center text-white font-bold" style="background-color: ${bgColor}; width: 22px; height: 22px; border: 2.5px solid ${borderColor}; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4); font-size: 11px;">${index + 1}</div>`;
                                } else {
                                    html = `<div class="marker-anim" style="background-color: ${sub.color}; width: 14px; height: 14px; border: 2.5px solid ${borderColor}; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4);"></div>`;
                                }
                                
                                const iconSize = viewMode === 'route' ? [22, 22] : [14, 14];
                                const iconAnchor = viewMode === 'route' ? [11, 11] : [7, 7];
                                const icon = L.divIcon({ html, className: '', iconSize, iconAnchor });

                                const marker = L.marker([item.lat, item.lng], { icon })
                                    .addTo(leafletMap.current)
                                    .bindPopup(`
                                        <div class="p-1.5 md:p-2 min-w-[150px] md:min-w-[180px]">
                                            <div class="flex items-center gap-1 mb-2">
                                                <span class="text-[10px] px-2 py-0.5 rounded ${sub.badgeBg} ${sub.badgeText} font-bold">
                                                    ${sub.label}
                                                </span>
                                                ${item.type === 'backup' ? `<span class="text-[10px] px-2 py-0.5 rounded bg-amber-100 text-amber-700 font-bold border border-amber-200">備選</span>` : ''}
                                                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-medium ml-auto">${item.member}</span>
                                            </div>
                                            <h3 class="font-bold text-sm text-slate-800 mb-1 leading-tight truncate">${item.location}</h3>
                                            <p class="text-xs text-gray-500 mb-3 leading-tight line-clamp-2">${item.content}</p>
                                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" style="color: #ffffff !important;"
                                               class="text-[11px] md:text-xs bg-blue-600 px-2 py-2 md:py-2.5 rounded-lg block text-center font-black shadow-md hover:bg-blue-700 active:scale-95 transition-all uppercase tracking-widest text-white">
                                               開啟導航頁面
                                            </a>
                                        </div>
                                    `, { closeButton: false, autoPanPadding: [20, 20] });
                                markersRef.current.push(marker);
                            });
                        });
                    }
                };

                const timer = setTimeout(updateMapDisplay, 300);
                return () => clearTimeout(timer);
            }, [itinerary, activeDay, viewMode, routeDays]);

            useEffect(() => {
                const handleResize = () => {
                    if(leafletMap.current) leafletMap.current.invalidateSize();
                }
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const handleUrlBlur = (e) => {
                const url = e.target.value;
                const match = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                if (match) {
                    setFormData(prev => ({ ...prev, lat: parseFloat(match[1]), lng: parseFloat(match[2]) }));
                }
            };

            const handleSave = async (e) => {
                e.preventDefault();
                const data = { 
                    ...formData, 
                    day: parseInt(formData.day), 
                    lat: parseFloat(formData.lat) || 26.2124, 
                    lng: parseFloat(formData.lng) || 127.6809 
                };

                if (isLocalMode) {
                    if (editingItem) {
                        setItinerary(prev => prev.map(i => i.id === editingItem.id ? { ...data, id: i.id } : i));
                    } else {
                        setItinerary(prev => [...prev, { ...data, id: Date.now().toString() }]);
                    }
                } else {
                    const db = firebase.firestore();
                    const itineraryCol = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerary');
                    if (editingItem) {
                        await itineraryCol.doc(editingItem.id).update(data);
                    } else {
                        await itineraryCol.add(data);
                    }
                }
                setIsModalOpen(false);
                setEditingItem(null);
                setFormData({ day: activeDay, time: '', content: '', location: '', url: '', lat: 26.2124, lng: 127.6809, member: MEMBERS[0], type: 'main', subType: 'attraction' });
            };

            const focusOn = (lat, lng) => {
                if (leafletMap.current) {
                    leafletMap.current.setView([lat, lng], 15, { animate: true });
                    const marker = markersRef.current.find(m => {
                        const p = m.getLatLng();
                        return Math.abs(p.lat - lat) < 0.0001 && Math.abs(p.lng - lng) < 0.0001;
                    });
                    if (marker) {
                        setTimeout(() => marker.openPopup(), 200);
                    }
                }
            };

            const toggleRouteDay = (day) => {
                if (routeDays.includes(day)) {
                    setRouteDays(routeDays.filter(d => d !== day));
                } else {
                    setRouteDays([...routeDays, day].sort());
                }
            };

            if (loading) return (
                <div className="flex h-full items-center justify-center bg-blue-50">
                    <div className="flex flex-col items-center gap-4">
                        <div className="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
                        <p className="text-blue-600 font-bold animate-pulse">資料同步中...</p>
                    </div>
                </div>
            );

            return (
                <div className="h-full flex flex-col w-full bg-slate-50">
                    
                    <header className="bg-slate-900 text-white px-4 py-3 shadow-xl flex-shrink-0 flex flex-wrap justify-between items-center z-20 gap-y-3">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-lg shadow-inner hidden md:block"><Icon name="map" className="w-5 h-5" /></div>
                            <div>
                                <h1 className="text-lg font-black tracking-tight leading-none">沖繩旅遊地圖</h1>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">
                                    {isLocalMode ? 'Offline Mode' : 'Real-time Sync'}
                                </p>
                            </div>
                        </div>
                        
                        <button onClick={() => { setEditingItem(null); setIsModalOpen(true); }} className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full font-bold text-sm flex items-center gap-1.5 shadow-lg active:scale-95 transition-all order-2 md:order-none">
                            <Icon name="plus" /> 新增
                        </button>
                        
                        <div className="w-full md:w-auto flex bg-slate-800 p-1 rounded-xl shadow-inner order-last md:order-none justify-center">
                            <button 
                                onClick={() => setViewMode('itinerary')} 
                                className={`flex-1 md:flex-none px-6 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${viewMode === 'itinerary' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                            >
                                <Icon name="list" className="w-3.5 h-3.5" /> 單日行程
                            </button>
                            <button 
                                onClick={() => setViewMode('route')} 
                                className={`flex-1 md:flex-none px-6 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${viewMode === 'route' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                            >
                                <Icon name="route" className="w-3.5 h-3.5" /> 路線地圖
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-col md:flex-row flex-1 overflow-hidden">
                        
                        {/* 地圖區域：強迫給予絕對位置保證高度 */}
                        <div className="relative w-full h-[45vh] md:h-full md:flex-1 z-0 order-1 md:order-2 flex-shrink-0 border-b-2 md:border-b-0 border-slate-200">
                            <div id="map-container" ref={mapRef} className="absolute inset-0 w-full h-full z-0 bg-slate-100"></div>
                            
                            <div className="absolute bottom-4 left-4 z-[1000] pointer-events-none md:pointer-events-auto">
                                <div className="bg-white/95 backdrop-blur-md p-3 rounded-2xl shadow-xl border border-slate-100 text-[10px] space-y-2">
                                    <div className="flex items-center gap-2 font-black text-slate-800 border-b border-slate-100 pb-1"><Icon name="info" className="w-3 h-3 text-blue-500" /> 圖例</div>
                                    {viewMode === 'itinerary' ? (
                                        <div className="flex flex-col gap-y-1.5">
                                            <div className="flex items-center gap-2 font-bold text-slate-600"><div className="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-sm border border-white"></div> 景點</div>
                                            <div className="flex items-center gap-2 font-bold text-slate-600"><div className="w-2.5 h-2.5 rounded-full bg-red-500 shadow-sm border border-white"></div> 食物</div>
                                            <div className="flex items-center gap-2 font-bold text-slate-600"><div className="w-2.5 h-2.5 rounded-full bg-purple-500 shadow-sm border border-white"></div> 購物</div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-1.5">
                                            <div className="flex items-center gap-2 font-bold text-slate-600"><div className="w-3 h-3 rounded-full shadow-sm flex items-center justify-center text-[6px] text-white bg-slate-800">1</div> 順序</div>
                                            <div className="flex items-center gap-2 font-bold text-slate-600"><div className="w-3 h-1 rounded-full bg-slate-400"></div> 動畫路線</div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 w-full md:w-[320px] flex flex-col bg-slate-50 overflow-hidden shadow-2xl z-10 order-2 md:order-1 flex-shrink-0">
                            {viewMode === 'itinerary' ? (
                                <>
                                    <div className="flex overflow-x-auto p-3 md:p-4 bg-white gap-2 border-b flex-shrink-0 scrollbar-hide shadow-sm z-10">
                                        {[1,2,3,4,5,6].map(d => (
                                            <button 
                                                key={d} 
                                                onClick={() => setActiveDay(d)} 
                                                className={`flex-shrink-0 w-12 h-10 rounded-xl font-black text-sm transition-all active:scale-90 ${
                                                    activeDay === d ? 'bg-slate-900 text-white shadow-md transform scale-105' : 'bg-slate-100 text-slate-400 border border-slate-200 hover:bg-slate-200'
                                                }`}
                                            >
                                                D{d}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-4 md:p-5 space-y-4 custom-scrollbar bg-slate-50 pb-10">
                                        {itinerary.filter(i => i.day === activeDay).map((item) => {
                                            const sub = SUB_TYPES[item.subType] || SUB_TYPES.attraction;
                                            const borderClass = item.subType === 'food' ? 'border-red-500/30 border-l-red-500' : 
                                                                item.subType === 'shopping' ? 'border-purple-500/30 border-l-purple-500' : 
                                                                'border-blue-500/30 border-l-blue-500';

                                            return (
                                            <div 
                                                key={item.id} 
                                                onClick={() => focusOn(item.lat, item.lng)}
                                                className={`group cursor-pointer bg-white border-2 rounded-2xl p-4 shadow-sm border-l-[6px] transition-all duration-300 active:scale-[0.98] md:hover:-translate-y-1 md:hover:shadow-xl ${borderClass}`}
                                            >
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="flex items-center gap-1.5 flex-wrap">
                                                        <span className="text-[11px] font-black text-slate-500 flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-md"><Icon name="clock" className="w-3 h-3" /> {item.time}</span>
                                                        <span className={`text-[9px] px-2 py-0.5 rounded-md font-black flex items-center gap-1 ${sub.badgeBg} ${sub.badgeText}`}>
                                                            <Icon name={sub.icon} className="w-2.5 h-2.5" /> {sub.label}
                                                        </span>
                                                        {item.type === 'backup' && (
                                                            <span className="text-[9px] px-2 py-0.5 rounded-md font-black bg-amber-100 text-amber-700 border border-amber-200">備選</span>
                                                        )}
                                                    </div>
                                                    <div className="flex gap-1">
                                                        <button onClick={(e) => { e.stopPropagation(); setEditingItem(item); setFormData(item); setIsModalOpen(true); }} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-blue-600 transition-colors"><Icon name="edit-3" className="w-4 h-4" /></button>
                                                        <button onClick={async (e) => { 
                                                            e.stopPropagation();
                                                            if(confirm('確定要刪除嗎？')) {
                                                                if (isLocalMode) setItinerary(prev => prev.filter(i => i.id !== item.id));
                                                                else await firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection('itinerary').doc(item.id).delete();
                                                            }
                                                        }} className="p-1.5 hover:bg-red-50 rounded-lg text-red-300 hover:text-red-600 transition-colors"><Icon name="trash-2" className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                                <h3 className="font-bold text-base mb-2.5 text-slate-800 leading-tight group-hover:text-blue-600 transition-colors">{item.content}</h3>
                                                <div className="flex flex-wrap gap-2 items-center">
                                                    <div className="flex items-center gap-1 text-[10px] text-slate-500 bg-white border border-slate-200 px-2 py-1 rounded-md">
                                                        <Icon name="user" className="w-3 h-3" /> {item.member}
                                                    </div>
                                                    <div className="text-[10px] flex items-center gap-1 text-blue-600 font-black bg-blue-50 px-2 py-1 rounded-md transition-colors">
                                                        <Icon name="map-pin" className="w-3 h-3" /> {item.location}
                                                    </div>
                                                </div>
                                            </div>
                                        )})}
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className="flex flex-col h-full bg-slate-50 pb-10">
                                        <div className="p-4 border-b border-slate-200 bg-white z-10 shadow-sm flex-shrink-0">
                                            <h2 className="font-black text-base text-slate-800 mb-1 flex items-center gap-2"><Icon name="route" className="w-5 h-5 text-blue-600"/> 勾選天數顯示路線</h2>
                                            <div className="grid grid-cols-3 gap-2 mt-3">
                                                {[1,2,3,4,5,6].map(d => (
                                                    <label key={d} className={`flex items-center gap-1.5 p-2 rounded-xl border-2 cursor-pointer transition-all active:scale-95 ${routeDays.includes(d) ? 'border-slate-300 bg-slate-50 shadow-sm' : 'border-slate-100 opacity-60 bg-white'}`}>
                                                        <input type="checkbox" checked={routeDays.includes(d)} onChange={() => toggleRouteDay(d)} className="w-3 h-3 rounded text-blue-600 focus:ring-blue-500 route-checkbox" />
                                                        <div className="w-2.5 h-2.5 rounded-full shadow-sm" style={{backgroundColor: DAY_COLORS[d]}}></div>
                                                        <span className="font-bold text-slate-700 text-[10px]">Day {d}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div className="flex-1 overflow-y-auto p-4 space-y-6 custom-scrollbar bg-slate-50">
                                            {routeDays.map(d => {
                                                const dayItems = itinerary.filter(i => i.day === d).sort((a,b) => a.time.localeCompare(b.time));
                                                if (dayItems.length === 0) return null;
                                                return (
                                                    <div key={d} className="relative">
                                                        <div className="absolute left-[11px] top-6 bottom-0 w-0.5 bg-slate-200/80 rounded-full"></div>
                                                        <h3 className="font-black text-xs mb-3 flex items-center gap-2 px-2 py-1 bg-white rounded-lg shadow-sm border border-slate-100 inline-flex" style={{color: DAY_COLORS[d]}}>
                                                            <div className="w-2 h-2 rounded-full" style={{backgroundColor: DAY_COLORS[d]}}></div>
                                                            Day {d} 停靠點
                                                        </h3>
                                                        <div className="space-y-3">
                                                            {dayItems.map((item, idx) => (
                                                                <div key={item.id} className="flex gap-2.5 relative z-10 pl-1 cursor-pointer group active:scale-[0.98] transition-transform" onClick={() => focusOn(item.lat, item.lng)}>
                                                                    <div className="w-[22px] h-[22px] rounded-full text-white flex items-center justify-center text-[10px] font-bold flex-shrink-0 shadow-md mt-1" style={{backgroundColor: DAY_COLORS[d]}}>{idx + 1}</div>
                                                                    <div className="bg-white p-2.5 rounded-xl shadow-sm border border-slate-100 w-full">
                                                                        <div className="text-[10px] font-black text-slate-400 mb-0.5"><Icon name="clock" className="w-2.5 h-2.5 inline pb-0.5"/> {item.time}</div>
                                                                        <div className="text-xs font-bold text-slate-700 truncate leading-tight">{item.location || item.content}</div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {routeDays.length === 0 && (
                                                <div className="text-center text-slate-400 font-bold text-sm py-10">請勾選上方天數顯示路線</div>
                                            )}
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>

                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[3000] flex items-end md:items-center justify-center p-0 md:p-4 bg-slate-900/80 backdrop-blur-sm">
                            <div className="bg-white rounded-t-[32px] md:rounded-[40px] w-full max-w-md shadow-2xl overflow-hidden animate-in slide-in-from-bottom-10 md:zoom-in duration-300 max-h-[90vh] flex flex-col">
                                <div className="bg-slate-900 p-5 md:p-6 text-white flex justify-between items-center flex-shrink-0">
                                    <h2 className="text-base md:text-lg font-black flex items-center gap-2 uppercase tracking-widest italic">
                                        {editingItem ? 'Edit Destination' : 'New Destination'}
                                    </h2>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-white/10 p-1.5 rounded-full"><Icon name="x" className="w-5 h-5" /></button>
                                </div>
                                <form onSubmit={handleSave} className="p-6 space-y-4 overflow-y-auto custom-scrollbar flex-1 pb-10">
                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black text-slate-400 mb-1 block uppercase">Day</label>
                                            <select value={formData.day} onChange={e => setFormData({...formData, day: e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500 bg-white">
                                                {[1,2,3,4,5,6].map(d => <option key={d} value={d}>Day {d}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black text-slate-400 mb-1 block uppercase">Time</label>
                                            <input type="text" placeholder="HH:mm" required value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 mb-1.5 block uppercase">負責人</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {MEMBERS.map(m => (
                                                <button type="button" key={m} onClick={() => setFormData({...formData, member: m})} className={`py-2 rounded-xl text-xs font-black border-2 transition-all ${formData.member === m ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-100 text-slate-500'}`}>{m}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 mb-1.5 block uppercase">類別與子類別</label>
                                        <div className="flex gap-2 mb-2">
                                            <button type="button" onClick={() => setFormData({...formData, type: 'main'})} className={`flex-1 py-2.5 rounded-xl text-xs font-black border-2 transition-all ${formData.type === 'main' ? 'bg-slate-800 border-slate-800 text-white shadow-md' : 'bg-white border-slate-100 text-slate-500'}`}>主要行程</button>
                                            <button type="button" onClick={() => setFormData({...formData, type: 'backup'})} className={`flex-1 py-2.5 rounded-xl text-xs font-black border-2 transition-all ${formData.type === 'backup' ? 'bg-amber-500 border-amber-500 text-white shadow-md' : 'bg-white border-slate-100 text-slate-500'}`}>備選景點</button>
                                        </div>
                                        <div className="flex gap-2">
                                            {Object.entries(SUB_TYPES).map(([key, info]) => (
                                                <button type="button" key={key} onClick={() => setFormData({...formData, subType: key})} className={`flex-1 py-2 rounded-xl text-[11px] font-black border-2 flex items-center justify-center gap-1 transition-all ${formData.subType === key ? `${info.badgeBg} ${info.border} ${info.badgeText} shadow-sm` : 'bg-white border-slate-100 text-slate-400'}`}>
                                                    <Icon name={info.icon} className="w-3.5 h-3.5" /> {info.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 mb-1 block uppercase">行程內容</label>
                                        <input type="text" required placeholder="例：午餐：燒肉神社" value={formData.content} onChange={e => setFormData({...formData, content: e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 mb-1 block uppercase">地點名稱</label>
                                        <input type="text" placeholder="例：燒肉神社 那霸店" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-2.5 font-bold outline-none focus:border-blue-500" />
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-100">
                                        <label className="text-[10px] font-black text-blue-600 mb-2 block uppercase">Google Map 連結 (自動填座標)</label>
                                        <input type="url" placeholder="貼上網址..." value={formData.url} onChange={e => setFormData({...formData, url: e.target.value})} onBlur={handleUrlBlur} className="w-full border-2 border-slate-200 rounded-xl p-2.5 bg-white mb-3 text-xs outline-none focus:border-blue-300" />
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="number" step="any" value={formData.lat} onChange={e => setFormData({...formData, lat: e.target.value})} className="w-full border-2 border-slate-200 rounded-lg p-2 text-xs font-mono" placeholder="Lat 緯度" />
                                            <input type="number" step="any" value={formData.lng} onChange={e => setFormData({...formData, lng: e.target.value})} className="w-full border-2 border-slate-200 rounded-lg p-2 text-xs font-mono" placeholder="Lng 經度" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-blue-600 transition-all flex items-center justify-center gap-2 mt-4">
                                        <Icon name="save" /> 儲存行程
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
